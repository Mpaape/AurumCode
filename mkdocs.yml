site_name: AurumCode
site_description: Gate de compliance para a organização - review, skills, política central, gate e cadeia de suprimentos
docs_dir: docs
site_dir: site
strict: true
theme:
  name: material
  language: pt-BR
  # System fonts: no request to an external font CDN, so the site and its
  # screenshots (scripts/docs/capturas.sh) depend only on the repository.
  font: false
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
extra_css:
  - stylesheets/extra.css
hooks:
  - scripts/docs/hooks.py
plugins:
  - search:
      lang: [pt]
      # Paths and file names are split too (demo/tutoriais/deliberacao/run.sh
      # is found by "deliberacao"); a dot followed by a digit (v1.58.2) is not.
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;'
exclude_docs: |
  /README.md
  site/*
  !site/workflow.yml
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
nav:
  - Início:
    - index.md
    - Entrada do repositório: README.md
  - Começando: getting-started.md
  - Referência: configuration.md
  - Guia corporativo: gate-corporativo.md
  - Arquitetura: architecture.md
  - Estendendo o Aurum: extensao.md
  - Qualidade e benchmark:
    - review-quality.md
    - benchmark.md
    - qa.md
    - review-cache.md
  # Specs (and Tutoriais, when docs/tutorials exists) are injected by
  # scripts/docs/hooks.py on_config.
