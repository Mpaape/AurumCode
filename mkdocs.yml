site_name: AurumCode
site_url: https://mpaape.github.io/AurumCode/
site_description: Gate de compliance para a organização - review, skills, política central, gate e cadeia de suprimentos
docs_dir: docs
site_dir: site
strict: true
theme:
  name: material
  language: pt-BR
  # System fonts: no request to an external font CDN, so the site and its
  # screenshots (scripts/docs/capturas.sh) depend only on the repository.
  font: false
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
# Link to the source on GitHub without repo_url: the theme's repo_url widget
# fetches stars and forks from api.github.com in the browser, and the site
# makes no external request (tests/docs). A nav tab and a footer icon are
# plain links.
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Mpaape/AurumCode
      name: AurumCode no GitHub
extra_css:
  - stylesheets/extra.css
# Mermaid 11.4.1 (dist/mermaid.min.js, sha256
# a43bc1afd446f9c4cc66ac5dd45d02e8d65e26fc5344ec0ef787f88d6ddb6f9e) is served
# from the site itself: the theme uses it instead of fetching it from a CDN,
# so the diagrams render with no external request. It is not versioned:
# scripts/docs/mermaid.sh downloads it at build time and checks the sha256.
extra_javascript:
  - javascripts/mermaid.min.js
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
hooks:
  - scripts/docs/hooks.py
plugins:
  - search:
      lang: [pt]
      # Paths and file names are split too (demo/tutoriais/deliberacao/run.sh
      # is found by "deliberacao"); a dot followed by a digit (v1.58.2) is not.
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;'
exclude_docs: |
  /README.md
  site/*
  !site/workflow.yml
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
nav:
  # Few tabs, by what the reader came to do: the horizontal bar must fit a
  # laptop screen. Tutoriais (after Início) and Specs (before the external
  # links) are injected by scripts/docs/hooks.py on_config.
  - Início:
    - index.md
    - Começando: getting-started.md
    - Entrada do repositório: README.md
  - Configurar:
    - Referência: configuration.md
    - Guia corporativo: gate-corporativo.md
    - Provedores de LLM: provedores.md
    - Changelog: changelog.md
    - Releases: releases.md
    - Aurum no seu agente: agentes.md
  - Como funciona:
    - Arquitetura: architecture.md
    - Estendendo o Aurum: extensao.md
    - Qualidade do review: review-quality.md
    - Benchmark: benchmark.md
    - QA no consumidor: qa.md
    - Cache de review: review-cache.md
  - GitHub: https://github.com/Mpaape/AurumCode
