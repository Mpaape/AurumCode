# Globs of secret files the review's repository tools (AUR-526) refuse to
# read, whatever the model asks for. Data, not code: deliberation.secret_paths
# in the policy adds patterns; nothing removes these. Same glob syntax as
# `ignore` ("**" crosses directories, "*" stays in one segment).
secret_paths:
  - "**/.env"
  - "**/.env.*"
  - "**/*.pem"
  - "**/*.key"
  - "**/*.p12"
  - "**/*.pfx"
  - "**/*.jks"
  - "**/*.keystore"
  - "**/id_rsa*"
  - "**/id_dsa*"
  - "**/id_ecdsa*"
  - "**/id_ed25519*"
  - "**/.netrc"
  - "**/.npmrc"
  - "**/.pypirc"
  - "**/.git-credentials"
  - "**/credentials"
  - "**/credentials.*"
  - "**/*.tfvars"
  - "**/.aws/**"
  - "**/.ssh/**"
