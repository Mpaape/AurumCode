# Security Review Rules
#
# Restored by AUR-434 from commit c12d7ab's .aurumcode/rules/security.yml
# and embedded into the binary via go:embed (see ../rules.go) so the
# catalog travels with the binary instead of depending on a directory at
# the caller's cwd. One id is normalized against the original file:
# `security/hardcoded-secrets` is now `security/hardcoded-secret`, the
# singular form the engine's own prompt contract and fixtures emit (see
# tests/fixtures/review/known-problem-response.json).
#
# AUR-435 restores the piece the c12d7ab measurement named as missing: the
# rules were metadata without a matcher. A rule may now carry `pattern` (a
# Go regexp the security pass applies to each ADDED diff line; compiled at
# load, a broken pattern fails the whole catalog loudly) and `standard`
# (the rule of the enforced project security standard,
# standards/security-review/rules.md, that scopes it). Rules without a
# pattern stay metadata-only: citable by a model finding (AUR-434), never
# matched by the security pass.
#
# AUR-442's 2026-08-13 dogfooding measured that only 2 of these 8 rules
# ever matched anything (sql-injection, command-injection), both requiring
# the narrow `"..." + var` concatenation shape -- so the project's own
# demo fixture (tests/fixtures/repos/git-demo), whose only purpose is to
# plant a plaintext secret, reported "No security findings." AUR-442
# restores the matcher for `security/hardcoded-secret` specifically
# (below), the rule that fixture depends on and the card's named priority,
# proven against both a dedicated fixture
# (tests/fixtures/review/vuln/hardcoded-secret) and git-demo itself. The
# remaining four patternless rules below (path-traversal, weak-crypto,
# insecure-random, missing-auth) are a deliberate, documented scope
# decision, not an oversight: see docs/specs/AUR-442.md's "The decision"
# section for why they stay metadata-only rather than ship a rushed,
# unvalidated matcher under this card's own no-false-promise rule.
#
# AUR-462's 2026-08-14 measurement found the same gap one layer over, in
# Node: `command-injection`'s pattern required an `l`/`v` right after
# `exec`, matching only C/Python's `execl`/`execv`/`execve` and never
# Node's canonical `child_process.exec`/`execSync`/`spawn(...,
# {shell:true})`; and `xss` was still patternless, so the equally common
# Node defect (`innerHTML = userInput`) went unmatched too. Both rules now
# carry the additional coverage (see each rule's own comment below); the
# other three patternless rules are unaffected.

rules:
  - id: security/sql-injection
    title: SQL Injection Vulnerability
    description: Potential SQL injection vulnerability detected
    severity: error
    category: security
    tags: [sql, injection, database]
    standard: SCR-001
    # A string literal carrying a SQL verb, concatenated with `+` right
    # after a quote, where what follows that `+` is a bare identifier (a
    # variable) rather than another string literal: the classic
    # query-built-by-concatenation-of-a-VALUE shape.
    #
    # AUR-466 (2026-08-23): the 2026-08-14 measurement on a real Node
    # repository found this pattern matching
    # `'SELECT * FROM daily_rollups' + (where.length ? ' WHERE ' +
    # where.join(' AND ') : '')` -- a query built entirely from string
    # CONSTANTS, whose actual values are bound later via `params.push(...)`
    # placeholders, not concatenated in. The old pattern only checked that
    # A quote-then-`+` existed anywhere after the verb; it never looked at
    # what came after the `+`. Two changes fix this without weakening the
    # true-positive shape (`"SELECT ... = '" + name + "'"`,
    # tests/fixtures/review/vuln/content/02/src/db.py:8 and
    # tests/unit/AUR-435.go's aur435SQLInjectionLine, both still match
    # byte-for-byte -- see docs/specs/AUR-466.md):
    #   1. `.*` (unbounded, can skip past any `+`) becomes `[^+]*`, which
    #      cannot cross a `+` character. Go's RE2 has no lookahead, so this
    #      is what pins the match to the FIRST `+` after the verb instead
    #      of letting the search jump to a later, unrelated `+` deeper in
    #      the line (the measured false positive has a SECOND `+` later in
    #      the line, `' WHERE ' + where.join(...)`, that an unanchored scan
    #      would otherwise also try).
    #   2. The suffix gains `\s*[A-Za-z_$][\w$.]*` -- the `+` must be
    #      immediately followed (whitespace only) by a bare identifier or
    #      dotted access, the same "does the RHS start with a real
    #      identifier character, not `(` or `"`/`'`" shape AUR-462 already
    #      uses for XSS. The measured false-positive's first `+` is
    #      followed by `(`, which this excludes structurally.
    # Known limitation, accepted deliberately: a query built as `"SELECT "
    # + "FROM " + userInput` (verb literal concatenated with another
    # literal FIRST, tainted value arriving on a later `+`) is missed,
    # because the pattern only inspects the first `+` after the verb. The
    # project's own SQL fixtures never take that shape; widening past the
    # first `+` reintroduces the false positive this card exists to kill.
    # AUR-481 (2026-09-03): Rust's idiomatic concatenation puts a method
    # call (`.to_owned()`/`.to_string()`) between the closing quote and the
    # `+`, e.g. `"SELECT ... '".to_owned() + name`, which the branch above
    # cannot see (nothing sits between quote and `+` there). Rust's more
    # common shape still is `format!("SELECT ... '{}'", name)`, no `+` at
    # all -- a fresh branch matches a `format!(...)` call whose format
    # string carries a SQL verb and a `{}` placeholder, followed by a
    # comma-separated identifier argument. Parametrized Rust queries
    # (`conn.query("SELECT ... $1", &[&name])`) have neither a `+` nor a
    # `format!` call and are excluded structurally, matching this card's
    # AC-002.
    pattern: '(?i)\b(select|insert|update|delete)\b[^+]*["'']\s*\+\s*[A-Za-z_$][\w$.]*|\b(select|insert|update|delete)\b[^+]*["'']\s*\.\s*(?:to_owned|to_string)\s*\(\s*\)\s*\+\s*[A-Za-z_$][\w$.]*|\bformat!\s*\(\s*"[^"]*\b(?:select|insert|update|delete)\b[^"]*\{\}[^"]*"\s*,\s*[A-Za-z_$][\w$.]*'

  - id: security/xss
    title: Cross-Site Scripting (XSS)
    description: Potential XSS vulnerability detected
    severity: error
    category: security
    tags: [xss, web, injection]
    # AUR-462 (2026-08-23): this rule shipped patternless from AUR-442
    # through AUR-461 -- one of five deliberately metadata-only rules, on
    # the documented grounds that XSS is a sink/taint question a
    # single-line regexp cannot decide without an unacceptable
    # false-positive rate. AUR-462's measurement narrowed the scope: a
    # write of a bare identifier or member-access chain (no call) into
    # `innerHTML`/`outerHTML`, `document.write(...)`, or React's
    # `dangerouslySetInnerHTML`'s `__html` key is the concrete, common
    # shape the outcome names.
    #
    # Adversarial review (2026-08-23) found the first cut over-matched: an
    # alternative anchored only the START of the RHS
    # (`[A-Za-z_$][\w$]*`), so it matched any call whose callee name
    # begins with an identifier character too -- including the canonical
    # XSS mitigation itself, `innerHTML = DOMPurify.sanitize(userInput)`,
    # and any other escaping helper (`escapeHtml(x)`). That is a false
    # positive that fires exactly on the developer who followed best
    # practice, which is worse than not having the rule (this card's own
    # principle). The pattern below anchors BOTH ends: the RHS (or
    # document.write's argument, or __html's value) must be a bare
    # identifier or dotted member-access chain (`[a-z_$][\w$.]*`)
    # immediately followed by its statement's own closing token (`;`/
    # end-of-line for the assignment forms, `)` for document.write,
    # `}}` for dangerouslySetInnerHTML) and NOTHING else -- so a `(` any
    # where in that span (a call) breaks the match structurally, since
    # Go's RE2 has no lookahead to exclude it any other way. A literal
    # constant (`"..."`, `'...'`, a backtick) is excluded the same way:
    # it does not start with an identifier character at all.
    #
    # The chosen trade-off, accepted deliberately: this now also misses
    # `innerHTML = getUserInput()` (a bare call returning untrusted data,
    # genuinely dangerous) -- the cost of excluding every call, sanitizer
    # and vulnerability alike, is losing that one shape, in exchange for
    # never flagging a sanitizer call again. See docs/specs/AUR-462.md's
    # "Known limitation" section for the full trade-off and the
    # SCREAMING_SNAKE_CASE decision (`TRUSTED_TEMPLATE` and similar
    # module-level constants are also excluded: the identifier class
    # requires a LOWERCASE start, `[a-z_$]`, not `[A-Za-z_$]`, on the
    # premise that untrusted runtime values are conventionally
    # camelCase/lowercase-led in JS, while an UPPERCASE- or
    # PascalCase-led identifier conventionally names a constant, class,
    # or component -- not a place user input flows through unescaped).
    # The keyword names themselves stay case-insensitive
    # (`(?i:innerHTML|outerHTML)` etc., scoped with `(?i:...)` rather than
    # a pattern-wide `(?i)`, so the new lowercase-start requirement on the
    # identifier itself is NOT also folded case-insensitive by accident).
    pattern: '\b(?i:innerHTML|outerHTML)\s*=\s*[a-z_$][\w$.]*\s*(?:;|$)|(?i:document\.write)\s*\(\s*[a-z_$][\w$.]*\s*\)|(?i:dangerouslySetInnerHTML)\s*=\s*\{\{\s*__html\s*:\s*[a-z_$][\w$.]*\s*\}\}'

  - id: security/command-injection
    title: Command Injection
    description: Potential command injection vulnerability
    severity: error
    category: security
    tags: [command, injection, shell]
    standard: SCR-001
    # A shell/exec call whose argument is assembled by string
    # concatenation right after a quote. AUR-462 (2026-08-23) measured
    # that `exec[lv]p?e?` requires an `l` or `v` right after `exec`, so it
    # matches C/Python's `execl`/`execv`/`execve` and never Node's
    # `child_process.exec`/`execSync` -- the canonical Node shape --
    # because `execSync` and the bare `exec(` have no `l`/`v` there. Two
    # alternatives restore that coverage without touching the original
    # branch (so C/Python/subprocess matching is unchanged, byte for
    # byte): a bare `exec(`/`execSync(` call carrying the same
    # quote-then-`+` concatenation shape as every other branch here, and a
    # `spawn(...)` call whose options carry `shell: true` -- the shape
    # that hands the whole argument list to a shell regardless of whether
    # the command itself is concatenated, so it is flagged on the
    # `shell: true` option alone. The Node argv form (`exec(["ping",
    # host])`, no shell, no concatenation) has no quote-then-`+` anywhere
    # in the call and so is excluded structurally, matching this card's
    # AC-002.
    #
    # AUR-481 (2026-09-03): Rust's idiomatic shell invocation is
    # `Command::new("sh").arg("-c").arg(...)` -- none of the branches
    # above match it (`Command::new` has no `exec`/`spawn`/`system`/`popen`
    # spelling, and there is no `shell: true` option). A branch analogous
    # to the `spawn(...shell:true)` one above -- `Command::new("sh"|"bash")`
    # plus a `.arg("-c")` call, flagged on that combination alone,
    # regardless of what a later `.arg(...)` on the same line carries
    # (`.to_owned() + h` concatenation or a `format!(...)` call, both) --
    # was first written, then reverted (this exact catalog change broke
    # tests/acceptance/AUR-462.sh's own MUT-001, which at the time
    # hardcoded security/command-injection's full pattern string as a
    # literal byte-for-byte anchor), and is now shipped: AUR-462.sh's
    # MUT-001 was reanchored (2026-09-03) on the rule's `- id:` line plus
    # a content-independent rewrite of the following `pattern:` line, so
    # it no longer depends on this pattern's exact bytes. The safe argv
    # form (`Command::new("ping").arg(host)`, no shell) has neither
    # "sh"/"bash" nor a `-c` arg and is excluded structurally, matching
    # this card's AC-002.
    pattern: '(?i)\b(system|popen|exec[lv]p?e?|subprocess\.(run|call|Popen))\s*\(.*["'']\s*\+|\bexec(Sync)?\s*\(.*["'']\s*\+|\bspawn\s*\(.*shell\s*:\s*true\b|\bCommand::new\s*\(\s*["''](?:sh|bash)["'']\s*\)[^;]*\.arg\s*\(\s*["'']-c["'']\s*\)'

  - id: security/path-traversal
    title: Path Traversal
    description: Potential path traversal vulnerability
    severity: error
    category: security
    tags: [path, filesystem, traversal]
    # AUR-442 (2026-08-13): no `pattern`, on purpose. Path traversal turns
    # on whether a path built from user input is validated before an I/O
    # call reads/writes it -- data-flow the added line alone cannot show.
    # Metadata-only: citable by a model finding (AUR-434), never matched
    # by the deterministic --seguranca pass. See docs/specs/AUR-442.md.

  - id: security/hardcoded-secret
    title: Hardcoded Secrets
    description: Hardcoded credentials or API keys detected
    severity: error
    category: security
    tags: [secrets, credentials, keys]
    standard: SCR-003
    # AUR-442 (2026-08-13): the priority restoration this card names --
    # tests/fixtures/repos/git-demo plants a plaintext secret specifically
    # to prove this rule fires. Two shapes, both requiring a
    # credential-named identifier (api key/secret/password/passwd/token/
    # credential/access key) assigned a value that mixes a letter with a
    # digit or hyphen, so a plain function call (`token := getToken()`) or
    # a plain numeric constant (`TOKEN_MAX_AGE_SECONDS = 31536000`) does
    # not match:
    #   1. `<keyword> (:=|:|=) "<value>"` -- a quoted assignment, the
    #      common application-source shape.
    #   2. `UPPER_SNAKE_KEYWORD = <value>` unquoted -- the env/config-file
    #      shape tests/fixtures/repos/git-demo's config/demo-tokens.txt
    #      and this rule's own fixture (tests/fixtures/review/vuln/
    #      hardcoded-secret) use. The keyword itself may be the whole
    #      identifier with no prefix (`TOKEN=...`, `SECRET=...`,
    #      `API_KEY=...`, `PASSWORD=...`), or prefixed
    #      (`DEMO_API_TOKEN=...`). Review fix: the leading `[A-Z0-9_]*`
    #      is zero-or-more, not a mandatory `[A-Z]` -- a mandatory leading
    #      uppercase letter would consume the keyword's own first
    #      character whenever the identifier has no prefix, so bare
    #      `TOKEN=`/`SECRET=`/`API_KEY=`/`PASSWORD=` would silently never
    #      match despite this exact comment (and docs/specs/AUR-442.md)
    #      promising them. The `\b` still requires a real identifier
    #      boundary, so `xTOKEN=...` (no boundary between `x` and `T`)
    #      stays out of scope.
    # Never matches the matched VALUE into a finding message: the security
    # pass always prints rule.Description, a trusted catalog string (see
    # securitypass.go), so the secret itself never reaches stdout.
    #
    # AUR-466 (2026-08-23): the 2026-08-14 measurement on a real Node
    # repository found this rule matching four placeholder/fixture values
    # verbatim: `sua-chave` (a documentation placeholder --
    # `export GEMINI_API_KEY=sua-chave`), `ttm-smoke-key` (a test fixture),
    # and `sk-body-ULTRA-SECRET` (a synthetic value a redaction test
    # asserts ON, so the test intentionally shapes it like a key prefix).
    # None of the three contains a digit -- the value-shape class was
    # `[0-9\-]`, which let a HYPHEN stand in for "the digit half" of the
    # required letter+digit mix, so any hyphenated multi-word phrase
    # ("sua-chave", "ttm-smoke-key", "ULTRA-SECRET") satisfied it with no
    # actual randomness. The fix is that one class, `[0-9\-]` -> `[0-9]`
    # (both occurrences, both alternation branches): the value must now
    # contain a real digit. This is the "low entropy / dictionary word"
    # placeholder signal from this card's own design notes, made concrete
    # the only way a line-level regexp can check it without a dictionary:
    # base64/hex/vendor-token secrets are, statistically, never digit-free
    # (tests/fixtures/review/vuln/hardcoded-secret's
    # `AURUM-FAKE-KEY-9000-2222`/`AURUM-FAKE-PASSWORD-9000-1111` and
    # git-demo's `AURUM-FAKE-TOKEN-0000-0001`/`AURUM-FAKE-WEBHOOK-0000-0003`
    # all still match, unchanged), while hand-typed placeholder words
    # overwhelmingly are. Deliberately NOT used: the `EXAMPLE|SAMPLE|
    # DUMMY|FAKE|TEST|SMOKE` marker-word idea from this card's own design
    # notes -- every existing true-positive fixture value in this
    # repository is itself named `AURUM-FAKE-...`, so that denylist would
    # silence the rule's own regression fixtures (AC-003 would break).
    # Adversarial review (2026-08-23) found the fix above BLOCKED: requiring
    # a digit still required, structurally, a specific ORDER -- digit then
    # a letter (or letter then digit) with >= 4 MORE characters after the
    # second pivot. tests/unit/AUR-442.go:307's own fixture value,
    # `AURUM-FAKE-CANARY-VALUE-7777`, has all four digits clustered at the
    # very end, so no choice of pivot ever leaves 4 characters trailing --
    # the value has a real digit and a real letter, just not in a position
    # the suffix-only requirement could see. That is a distinct defect from
    # "digit-free real secret" (the accepted limitation below): this one
    # is digit-BEARING and was still missed, and it broke AUR-442's own
    # regression (tests/acceptance/AUR-442.sh AC-001 went from exit 0 to
    # exit 1). RE2 has no lookahead, so "contains a digit somewhere"
    # cannot be expressed as a single order- and position-free check; the
    # fix widens each of the two pivot orders (digit-then-letter,
    # letter-then-digit) from one branch (padding required strictly AFTER
    # the second pivot) to two (padding required BEFORE the first pivot,
    # OR after the second) -- four branches total. This is not a full
    # solution (padding split across BOTH sides in amounts each under 4 is
    # still theoretically missable; no such value exists in this
    # repository's fixtures or in the measurement that opened this card),
    # but it resolves every concrete shape measured: digits clustered at
    # the end (`AURUM-FAKE-CANARY-VALUE-7777`), digits clustered at the
    # start, and a single digit sitting close to one edge with little
    # trailing room. Known residue, measured and accepted rather than
    # chased under this deadline: `ttm-0000000000000000000000` (digits
    # present, zero entropy) still matches -- entropy/repetition is a
    # separate axis this card's digit check was never meant to cover. See
    # docs/specs/AUR-466.md.
    # Known limitation, accepted deliberately: a digit-free real secret
    # (some base64 alphabets can produce one, e.g. a purely-alphabetic
    # 32-byte key) is now missed. See docs/specs/AUR-466.md.
    #
    # AUR-481 (2026-09-03): Rust puts a TYPE between the identifier and
    # `=` (`const ACCESS_KEY: &str = "..."`), so neither branch above ever
    # sees a quote right after `:=`/`:`/`=`. Two new branches, each reusing
    # the same case-insensitive keyword group and the same digit+letter
    # VALUE class as branch one (no weakening): a typed declaration
    # (`const`/`static`/`let`, `: &str`/`: String`) assigned a quoted
    # literal directly, and the `String::from("...")` wrapper (type
    # annotation optional there, since `let token = String::from("...")`
    # carries none). `const MAX_RETRIES: u32 = 5` and
    # `const GREETING: &str = "hello world"` stay excluded: no
    # secret-shaped keyword in the identifier, and the digit-free greeting
    # also fails the VALUE class -- matching this card's AC-002.
    pattern: '(?i:[A-Za-z0-9_]*(api[_-]?key|secret|password|passwd|token|credential|access[_-]?key)[A-Za-z0-9_]*\s*(?::=|[:=])\s*["''](?:[A-Za-z0-9_./\-]{4,}[0-9][A-Za-z0-9_./\-]*[A-Za-z][A-Za-z0-9_./\-]*|[A-Za-z0-9_./\-]*[0-9][A-Za-z0-9_./\-]*[A-Za-z][A-Za-z0-9_./\-]{4,}|[A-Za-z0-9_./\-]{4,}[A-Za-z][A-Za-z0-9_./\-]*[0-9][A-Za-z0-9_./\-]*|[A-Za-z0-9_./\-]*[A-Za-z][A-Za-z0-9_./\-]*[0-9][A-Za-z0-9_./\-]{4,})["''])|\b[A-Z0-9_]*(?:API[_-]?KEY|SECRET|PASSWORD|PASSWD|TOKEN|CREDENTIAL|ACCESS[_-]?KEY)[A-Z0-9_]*\s*=\s*(?:[A-Za-z0-9_./\-]{4,}[0-9][A-Za-z0-9_./\-]*[A-Za-z][A-Za-z0-9_./\-]*|[A-Za-z0-9_./\-]*[0-9][A-Za-z0-9_./\-]*[A-Za-z][A-Za-z0-9_./\-]{4,}|[A-Za-z0-9_./\-]{4,}[A-Za-z][A-Za-z0-9_./\-]*[0-9][A-Za-z0-9_./\-]*|[A-Za-z0-9_./\-]*[A-Za-z][A-Za-z0-9_./\-]*[0-9][A-Za-z0-9_./\-]{4,})|(?i:[A-Za-z0-9_]*(api[_-]?key|secret|password|passwd|token|credential|access[_-]?key)[A-Za-z0-9_]*\s*:\s*(?:&''?(?:static\s+)?str|String)\s*=\s*["''](?:[A-Za-z0-9_./\-]{4,}[0-9][A-Za-z0-9_./\-]*[A-Za-z][A-Za-z0-9_./\-]*|[A-Za-z0-9_./\-]*[0-9][A-Za-z0-9_./\-]*[A-Za-z][A-Za-z0-9_./\-]{4,}|[A-Za-z0-9_./\-]{4,}[A-Za-z][A-Za-z0-9_./\-]*[0-9][A-Za-z0-9_./\-]*|[A-Za-z0-9_./\-]*[A-Za-z][A-Za-z0-9_./\-]*[0-9][A-Za-z0-9_./\-]{4,})["''])|(?i:[A-Za-z0-9_]*(api[_-]?key|secret|password|passwd|token|credential|access[_-]?key)[A-Za-z0-9_]*\s*(?:\:\s*(?:&''?(?:static\s+)?str|String)\s*)?=\s*String::from\(\s*["''](?:[A-Za-z0-9_./\-]{4,}[0-9][A-Za-z0-9_./\-]*[A-Za-z][A-Za-z0-9_./\-]*|[A-Za-z0-9_./\-]*[0-9][A-Za-z0-9_./\-]*[A-Za-z][A-Za-z0-9_./\-]{4,}|[A-Za-z0-9_./\-]{4,}[A-Za-z][A-Za-z0-9_./\-]*[0-9][A-Za-z0-9_./\-]*|[A-Za-z0-9_./\-]*[A-Za-z][A-Za-z0-9_./\-]*[0-9][A-Za-z0-9_./\-]{4,})["'']\s*\))'

  - id: security/weak-crypto
    title: Weak Cryptography
    description: Use of weak or deprecated cryptographic algorithms
    severity: warning
    category: security
    tags: [crypto, encryption, hash]
    # AUR-442 (2026-08-13): no `pattern`, on purpose. A precise matcher
    # needs an enumerated, tested set of weak-primitive call idioms across
    # languages (hashlib.md5(, crypto/rc4, Cipher.getInstance("DES"), ...);
    # this card scoped its one new matcher to the named priority
    # (hardcoded-secret) rather than ship a second, unvalidated pattern
    # under the same deadline. Metadata-only: citable by a model finding
    # (AUR-434), never matched by the deterministic --seguranca pass. See
    # docs/specs/AUR-442.md.

  - id: security/insecure-random
    title: Insecure Random Number Generation
    description: Use of insecure random number generator
    severity: warning
    category: security
    tags: [random, crypto, security]
    # AUR-442 (2026-08-13): no `pattern`, on purpose. Whether math/rand or
    # Python's random module is a real defect depends on the call's
    # security context (a session token vs. a UI shuffle), which a
    # line-level regexp cannot tell apart without an unacceptable
    # false-positive rate. Metadata-only: citable by a model finding
    # (AUR-434), never matched by the deterministic --seguranca pass. See
    # docs/specs/AUR-442.md.

  - id: security/missing-auth
    title: Missing Authentication
    description: Endpoint or function lacks proper authentication
    severity: error
    category: security
    tags: [auth, authentication, access]
    # AUR-442 (2026-08-13): no `pattern`, on purpose. Missing
    # authentication is an absence -- a route or handler that should
    # require a check and does not -- which cannot be decided by matching
    # the added lines of a diff; it needs the surrounding handler's
    # control flow. Metadata-only: citable by a model finding (AUR-434),
    # never matched by the deterministic --seguranca pass. See
    # docs/specs/AUR-442.md.
