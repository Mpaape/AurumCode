# Data, not code: how AurumCode groups the grammar names that the tree-sitter
# runtime reports. A grammar that is not listed is category "other", which the
# review treats as reviewable code (it fails closed). Adding a language needs no
# Go change, and a language the runtime gains with an update works without an
# entry here.
categories:
  backend: [go, gomod, python, java, kotlin, c, cpp, c_sharp, rust, ruby, php, swift, objc, scala, dart, elixir, erlang, haskell, lua, perl, groovy, zig, julia, r, ocaml, fsharp, clojure, nim, crystal, d]
  frontend: [javascript, typescript, tsx, html, css, scss, less, vue, svelte, astro]
  database: [sql, prisma, sparql]
  infrastructure: [bash, fish, powershell, make, dockerfile, hcl, cmake, nix, bicep, puppet, nginx, just, ninja, earthfile]
  config: [json, json5, yaml, toml, xml, ini, properties, editorconfig, gitignore, gitattributes, requirements, csv, kdl, ron]
  # Documentation is a STRONG-detection category: only grammars the runtime
  # picks by an extension that means that markup language and nothing else
  # (.md, .rst, .org, ...). A documentation file leaves the code review, so a
  # grammar chosen by a generic extension must never be listed here.
  documentation: [markdown, markdown_inline, rst, org, djot, typst, norg]
  # Weak detection: the runtime picks these grammars only from a generic
  # extension (vimdoc is chosen for any .txt file, which is as likely to hold
  # a config dump or a secret as help text). They are reviewed as text, like
  # any other file without a code grammar.
  other: [vimdoc]
# Well-known configuration file names that a grammar cannot identify by name.
config_files:
  - go.sum
  - docker-compose.yml
  - docker-compose.yaml
  - .env
  - .env.example
  - go.mod
  - dockerfile
  - makefile
  - .dockerignore
  - build.gradle
  - setup.py
  - cargo.toml
  - package.json
