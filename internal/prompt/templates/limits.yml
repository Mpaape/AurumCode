# Tetos padrao do prompt de review, em tokens estimados. Sao a fonte unica
# dos valores default: o codigo nao repete nenhum destes numeros.
#
# prompt_max_tokens: teto do prompt inteiro (system + user). Um diff que nao
#   cabe e aparado por hunk inteiro e declarado na secao de cobertura; nunca
#   cortado em silencio.
# evidence_max_tokens: teto da secao de evidencia deterministica; itens alem
#   dele sao contados como "N omitidos".
# tools_max_tokens: teto da secao de ferramentas disponiveis, mesma regra.
# batch_max_count: quantos lotes uma revisao pode fazer quando o diff nao cabe
#   num prompt (cada lote e um prompt com o mesmo template, politica e skills).
#   Acima dele os arquivos restantes ficam fora, declarados, e a aprovacao e
#   retida.
# batch_max_prompt_tokens: teto da soma dos prompts de todos os lotes (o custo
#   de entrada da revisao inteira), mesma regra. O padrao equivale a quatro
#   prompts cheios: e o numero de lotes que limita, ate a configuracao baixar.
#
# O catalogo de regras e o texto das skills NAO tem teto: crescem com a
#   politica e entram inteiros no prompt. Um teto ali derrubava a revisao na
#   primeira politica maior que o previsto (issue #179); o limite real e a
#   janela de contexto do modelo, e quem cuida dela e o teto acima.
prompt_max_tokens: 120000
evidence_max_tokens: 4096
tools_max_tokens: 1024
batch_max_count: 4
batch_max_prompt_tokens: 480000
