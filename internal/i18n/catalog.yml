  review.comment: "Comentário"
  review.approve: "Aprovado"
  review.inconclusive: "Inconclusivo"
  review.blocking_findings: "A revisão encontrou %d achado(s) bloqueante(s) que devem ser tratados antes do merge."
  review.non_blocking_findings: "A revisão encontrou observações, mas nenhum achado bloqueante permanece na mudança revisada."
  review.optional_suggestions: "Nenhum achado bloqueante foi identificado; as sugestões abaixo são melhorias opcionais."
  review.no_blocking_findings: "Nenhum achado bloqueante foi identificado na mudança revisada."
  review.quality_incomplete: "A revisão por modelo não foi concluída. Apenas as verificações determinísticas produziram resultado; este parecer não aprova a mudança."
  review.suggestion_applicable: "Substituição aplicável em `%s`."
  review.suggestion_not_applicable: "Sugestão sem localização elegível no diff adicionado; exibida como orientação, sem substituição aplicável."
  review.coverage_heading: "Cobertura da revisão"
  review.coverage_summary: "%d de %d arquivo(s) do diff foram cobertos; %d não foram revisados por completo."
  review.coverage_partial: "%d arquivo(s) tiveram parte dos trechos omitida pelo limite de tokens; os achados podem não cobrir os trechos omitidos."
  review.coverage_budget: "%d arquivo(s) ficaram fora da revisão pelo limite de tokens."
  review.coverage_ignored: "%d arquivo(s) ignorados (configuração `ignore` do repositório ou binários): ficam fora da conta de cobertura e a ausência deles no contexto NÃO prova que não existam no diff."
  review.coverage_filtered: "%d arquivo(s) foram filtrados antes da revisão (gerado, grande demais, sem patch ou binário fora do catálogo de formatos); arquivo não revisado nunca conta como aprovado."
  review.coverage_no_structure: "%d arquivo(s) não têm gramática no runtime: o contexto estrutural (símbolos e imports) não foi produzido e o modelo leu apenas o texto."
  review.summary_withheld: "Resumo do modelo omitido: %d achado(s) propostos foram descartados pelos filtros de escopo/regra."
  notice.changelog_unavailable: "Changelog indisponível: os metadados de commit desta revisão não puderam ser lidos; a versão sugerida e a entrada de changelog foram omitidas."
  notice.model_invalid_output: "Revisão de qualidade inconclusiva: a resposta do modelo não passou no parser (%s); o modelo não foi considerado e os achados determinísticos (análise estática e segurança) foram publicados."
  notice.scanner_inconclusive: "%s (%s) inconclusivo: a varredura não produziu resultado confiável (%s); nenhum achado determinístico do %s foi publicado nesta execução."
  notice.scanner_detail: "Detalhe da engine: %s"
  notice.provider_failure: "Revisão de qualidade inconclusiva: a revisão não foi executada -- nenhum provedor de modelo respondeu (falha de transporte) ou a chamada foi recusada antes de ser feita (--limite); os achados determinísticos (análise estática e segurança), quando houver, foram publicados."
  notice.history_unavailable: "Histórico do PR indisponível: esta revisão considera o diff atual, mas não confirma decisões ou correções de rodadas anteriores."
  notice.context_omitted: "Contexto do repositório omitido: %s; esta revisão não envia o conteúdo do checkout local ao provedor e considera apenas o diff remoto."
  notice.context_omitted.repository: "o checkout local não é o repositório revisado"
  notice.context_omitted.head: "o HEAD do checkout local não corresponde ao commit revisado do pull request"
  notice.context_omitted.dirty: "o checkout local tem alterações não commitadas, arquivos não rastreados ou conteúdo que não corresponde ao commit revisado"
  notice.context_omitted.unconfirmed: "não foi possível confirmar a identidade do checkout local"
  inline.removed_line: "Linha removida (base)"

