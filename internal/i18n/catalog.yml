# Textos de interface por idioma. Toda chave existe em pt-BR e en, com os
# mesmos verbos de formatacao na mesma ordem (testado). Valores sempre entre
# aspas duplas. Os textos sao dados de apresentacao, nunca instrucao ao modelo.

