schema: aurum.redaction-cases
version: 1
limits:
  max_vectors: 64
  max_total_bytes: 4194304
  deadline_seconds: 30
cases:
  - name: "url-query-canary"
    kind: nominal
    channel: url
    expect: redacted
    input: "GET https://api.example.test/v1/repos?access_token=${CANARY}&page=2 HTTP/1.1"
    expected: "GET https://api.example.test/v1/repos?[REDACTED] HTTP/1.1"
  - name: "auth-header-canary"
    kind: nominal
    channel: header
    expect: redacted
    input: "Authorization: Bearer ${CANARY}"
    expected: "Authorization: [REDACTED]"
  - name: "body-json-canary"
    kind: nominal
    channel: body
    expect: redacted
    input: "{'note':'deploy key ${CANARY} rotated','ok':true}"
    expected: "{'note':'deploy key [REDACTED] rotated','ok':true}"
  - name: "diff-added-secret"
    kind: nominal
    channel: diff
    expect: redacted
    input: "+db_password=${CANARY}"
    expected: "+db_password=[REDACTED]"
  - name: "error-cause-canary"
    kind: nominal
    channel: error
    expect: redacted
    input: "credential rejected for ${CANARY} on host db-primary"
    expected: "credential rejected for [REDACTED] on host db-primary"
  - name: "tool-result-canary"
    kind: nominal
    channel: tool_result
    expect: redacted
    input: "tool git_push result: token=${CANARY} applied to branch main"
    expected: "tool git_push result: token=[REDACTED] applied to branch main"
  - name: "sink-unknown"
    kind: invalid
    channel: sink
    expect: typed-error
    error: sink-unauthorized
    input: "telemetry"
  - name: "sink-empty"
    kind: invalid
    channel: sink
    expect: typed-error
    error: sink-unauthorized
    input: ""
  - name: "input-at-limit"
    kind: boundary
    channel: limit
    expect: identity
    repeat_unit: "A"
    repeat_count: 65536
  - name: "input-beyond-limit"
    kind: boundary
    channel: limit
    expect: typed-error
    error: input-too-large
    repeat_unit: "A"
    repeat_count: 65537
