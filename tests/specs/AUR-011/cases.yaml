schema: aurum.git-demo-fixture-cases
version: 1
# Sealed vectors for AUR-011 / AC-001.
#
# `limits` is the harness contract, enforced by tests/acceptance/AUR-011.sh:
# more than 64 vectors, more than 4 MiB of vector input in total, or a deadline
# above 30 s is refused before any vector runs.
#
# `domain` restates the bounds the fixture builder itself enforces, so the
# boundary vectors below sit exactly on them and one step past them.
#
# Every `input_digest` is recomputed from the constructed input at run time and
# every `input_bytes` is measured, so a vector cannot silently change what it
# feeds the program under test.
limits:
  max_vectors: 64
  max_total_bytes: 4194304
  deadline_seconds: 30
domain:
  max_commits: 16
  max_files_per_commit: 16
  max_object_bytes: 65536
cases:
