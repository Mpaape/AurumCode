    kind: nominal
    input_digest: "sha256:754f1cbca4d0d6f01252480d3490ccb0c5d4ac15649623f578c4c5cafdf5b3e7"
    input_bytes: 2901
    expected_exit: 0
    expected_code: "recreated"
    effects: 1
    artifact_digest: "sha256:f6c7cd8a7c12bdbb84407b42c00abb669df8d67d3f1d20ce046eae8877d7c0cc"
  - name: "nominal-replay"
