# O AurumCode revisa o proprio AurumCode. O que nao esta aqui usa o padrao
# do produto; redacao de segredos e regras de seguranca nao se configuram.
# Convencoes do repo: .aurumcode/skills/<nome>/SKILL.md; cada "## " vira
# regra citavel <nome>#<slug>, e "severity: error" nela reprova pelo gate.
review:
  language: pt-BR
  inline_comments: true   # achado bloqueante e sugestao aplicavel na propria linha
# Fixtures de teste tem canarios de segredo e de injecao de proposito; as
# capturas geradas da documentacao e os logs gravados dos tutoriais (out/ e
# expected/, regravados pelo run.sh) repetem a saida desses casos. Artefato
# gerado se revisa na fonte que o gera, nao na saida gravada.
ignore:
  - "tests/**"
  - "docs/assets/capturas/**"
  - "demo/tutoriais/*/out/**"
  - "demo/tutoriais/*/expected/**"
  - "demo/gate-corporativo/out/**"
  - "demo/gate-corporativo/expected/**"
  - "demo/do-zero/out/**"       # evidencia gravada do roteiro (contem a chave de proposito do defeito)
  - "demo/do-zero/expected/**"
  - "demo/do-zero/camadas/**"   # repositorios de exemplo da POC (politica e padroes encenados), nao sao o produto
  - "demo/tutoriais/camadas/devops-policy-com-gate/**"
  - "demo/tutoriais/camadas/devops-policy-mesmo-nome/**"
  - "demo/tutoriais/camadas/devops-policy/**"
  - "demo/tutoriais/camadas/security-policy-mesmo-nome/**"
  - "demo/tutoriais/camadas/security-policy/**"
  - "demo/tutoriais/camadas/servico-afrouxa/**"
  - "demo/tutoriais/camadas/servico-mesmo-nome/**"
  - "demo/tutoriais/camadas/servico/**"
  - "demo/tutoriais/camadas/servico-mudanca/**"            # a mudanca com defeito encenada no tutorial
  - "demo/tutoriais/camadas/servico-mesmo-nome-mudanca/**"
  - ".board/**"             # estado do board: validado por .board/pipeline.sh, nao e produto
  - "docs/specs/**"          # historico de cada card, por desenho
  - "docs/site/**"          # pagina estatica antiga com saidas embutidas; nao e codigo
gate:
  fail_on: [error]      # achado error (modelo, skill ou scanner) reprova
  inconclusive: block   # revisao que nao concluiu nunca aprova
quality_gates:
  scanners:
    - engine: gitleaks  # segredos no intervalo de commits da PR
      required: true
    - engine: semgrep   # SAST: so reprova pelo que a PR adicionou
    - engine: govet     # go vet com o Go da imagem: so linhas adicionadas
      fail_on: warning
deliberation:
  enabled: true
  max_rounds: 3
  per_tool_timeout_seconds: 120
# Toda PR para a main acrescenta uma entrada concisa em "## Unreleased" do
# CHANGELOG.md; o check "Changelog obrigatório" le este modo da base (AUR-509).
changelog_check:
  mode: required
