limits[1].scope: document read_paths are sealed by whole-file digest and are never interpreted
limits[1].consequence: this card proves no read_path byte changed without a deliberate reseal; it does not classify what a documentation command does
limits[2].scope: tool identity is derived only from read_paths whose basename is a registered dependency-manifest format
limits[2].consequence: a manifest format with no registered parser stops the accept instead of being guessed at or demoted to an opaque document
limits[3].scope: this repository ships no ecosystem-native resolved lockfile (no Gemfile.lock, no .aurumcode/Gemfile.lock) and neither is a read_path of this card
limits[3].consequence: the required resolution source is the card-scoped artifact named in resolution.path; its absence is a typed failure, and a future Gemfile.lock must be added to the card read_paths before it can be honoured
limits[4].scope: artifact digests come from the resolution artifact under the declared digest-domain and are NOT verified against rubygems.org, because the accept has no network
limits[4].consequence: this card proves every tool has exactly one well-formed digest, that one artifact identity maps to one digest, that no two artifacts share a digest, and that the value is byte-stable across runs; it does NOT prove the digest equals the upstream .gem checksum
limits[5].scope: dependency constraints are recorded verbatim and never interpreted
limits[5].consequence: a constraint that would admit many versions is neither blessed nor rejected by its syntax; what binds is the exact resolved version, so a version-less or open-bounded declaration fails unless the resolution names one exact release for that exact (manifest, name) pair
limits[6].scope: the resolved runtime version is checked for RESOLUTION CONSISTENCY only and is NEVER compared against any tool version; this card performs no compatibility judgement of any kind
limits[6].consequence: this card proves that every manifest format has its runtime family resolved to exactly one exact version, that every resolved runtime is used by some manifest, and that every tool[] entry cites that same family and that same version; it does NOT prove the resolved runtime satisfies a tool required_ruby_version, and it never could offline, because that metadata lives in the upstream gemspec and appears in no read_path of this card
limits[6].why_not_delegated: an ecosystem resolver is not a substitute either. Measured with bundler 2.4.19 under ruby 3.2.11 on 2026-08-06: a manifest declaring the runtime pin 2.4.0 together with a documentation dependency whose upstream gemspec requires runtime >= 2.5.0 produced a resolution with exit 0 and recorded the RUNNING interpreter 3.2.11p268, not the declared pin. The resolver enforces the upstream runtime requirement against the interpreter executing it (measured in the opposite direction: bundler 1.17.3 under ruby 2.4.10 refused the same dependency with exit 6), never against a declared runtime version, so the existence of a resolution is not evidence that a declared runtime pin is compatible with a resolved dependency. The names, versions and full command lines of both measurements are in section 6 of the spec sealed above, which is a document rather than executable code
limits[6].why_not_runnable: the one bundler subcommand that does refuse a declared/running runtime mismatch is not available to this accept either. Measured on 2026-08-06: bundle check and bundle install on that same Gemfile both exited 18 with "Your Ruby version is 3.2.11, but your Gemfile specified 2.4.0" - an equality test between the declared pin and the interpreter already executing, not a tool-versus-runtime judgement - and the sealed accept image bash@sha256:ae4668c2560999e65e89532cd2ad1b6688bb23298189f0bd229ef80fa4bd0831 has no ruby, no bundle and no gem at all (command -v for all three exited 127), so no resolver can run inside the accept and no lockfile it produced could be trusted as evidence without also trusting the network it needed
limits[6].error_code: the code emitted by the checks in this scope is runtime-resolution-inconsistent, named for what it verifies; it was called runtime-incompatible through round 4 and that name promised a comparison no branch of this card has ever performed
nonderivable[1].field: trusted_registry
nonderivable[1].justification: the single gem origin this card accepts is a trust decision, not a fact extracted from read_path bytes; it is an allowlist of one, so an unanticipated origin fails rather than passes
nonderivable[2].field: format registry (basename -> manifest format)
nonderivable[2].justification: which basenames name a machine-readable dependency manifest is ecosystem knowledge; every non-match falls through to the whole-file-digest path, so the registry can never create a blind spot
nonderivable[3].field: tool[*].allowlisted_command
nonderivable[3].justification: one template per manifest format, deliberately narrower than the raw source (no network install at accept time); instantiated identically for every tool, never looked up per name
nonderivable[4].field: tool[*].output_schema
nonderivable[4].justification: one regex template per manifest format with the derived name and the resolved version substituted in; not present in any read_path
nonderivable[5].field: resolution.path and resolution.digest_domain
nonderivable[5].justification: which artifact resolves a manifest format, and under which digest domain, are trust decisions; both are allowlists of one, so an unanticipated resolution source or digest domain fails rather than passes
end: bootstrap-lock-v5
