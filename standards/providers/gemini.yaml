# AurumCode provider contract: Gemini (Google Generative Language API).
#
# Flat scalar keys only (no nested mappings) so tests/acceptance/AUR-019.sh
# and tests/integration/AUR-019_test.go can parse this file with one line-anchored
# rule per key instead of a general YAML walk. Values that are markdown
# links are double-quoted so this file also parses as strict YAML.
#
# This card fixes the contract; it implements no client and makes no network
# call. Every "supported" capability below MUST have a matching
# fixture_<capability> entry pointing at a recorded, non-secret fixture
# under tests/specs/AUR-019/fixtures/gemini/.

provider: Gemini
source: "[google-genai v2.16.0](https://github.com/googleapis/python-genai/releases/tag/v2.16.0)"
version: v2.16.0
date: 2026-07-30

transport: http

wire_endpoint: "/v1beta/models/{model}:generateContent"
wire_method: POST
wire_content_type: application/json

auth_scheme: api-key-query-or-header
auth_header: x-goog-api-key
auth_binding: query-param
auth_query_param: key
auth_format: "?key=$GEMINI_API_KEY query parameter, or x-goog-api-key header; Vertex AI variant uses OAuth2/service-account credentials instead"

error_envelope: "error.code,error.message,error.status,promptFeedback.blockReason"
error_taxonomy: "INVALID_ARGUMENT-400,PERMISSION_DENIED-403,NOT_FOUND-404,RESOURCE_EXHAUSTED-429,INTERNAL-500,blockReason-SAFETY,blockReason-BLOCKLIST,blockReason-PROHIBITED_CONTENT,blockReason-IMAGE_SAFETY"

capability_streaming: supported
capability_tool_use: supported
capability_structured_output: supported

wire_action_streaming: streamGenerateContent
wire_action_tool_use: generateContent
wire_action_structured_output: generateContent

fixture_streaming: tests/specs/AUR-019/fixtures/gemini/streaming.json
fixture_tool_use: tests/specs/AUR-019/fixtures/gemini/tool_use.json
fixture_structured_output: tests/specs/AUR-019/fixtures/gemini/structured_output.json
