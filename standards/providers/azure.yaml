# AurumCode provider contract: Azure (Azure OpenAI).
#
# Flat scalar keys only (no nested mappings) so tests/acceptance/AUR-019.sh
# and tests/integration/AUR-019_test.go can parse this file with one line-anchored
# rule per key instead of a general YAML walk. Values that are markdown
# links are double-quoted so this file also parses as strict YAML.
#
# This card fixes the contract; it implements no client and makes no network
# call. Every "supported" capability below MUST have a matching
# fixture_<capability> entry pointing at a recorded, non-secret fixture
# under tests/specs/AUR-019/fixtures/azure/.

provider: Azure
source: "[Azure OpenAI REST API reference (data-plane inference, 2024-10-21 GA)](https://learn.microsoft.com/en-us/azure/ai-services/openai/reference?view=rest-openai-2024-10-21)"
version: 2024-10-21
date: 2026-05-19

transport: http

wire_endpoint: "/openai/deployments/{deployment-id}/chat/completions?api-version=2024-10-21"
wire_method: POST
wire_content_type: application/json

auth_scheme: api-key-header-or-entra-bearer
auth_header: api-key
auth_binding: header
auth_format: "api-key: <AZURE_OPENAI_KEY>, or Authorization: Bearer <Entra ID token> for Microsoft Entra ID / managed identity"

error_envelope: "error.message,error.type,error.param,error.code,error.innerError.code,error.innerError.content_filter_results"
error_taxonomy: "invalid_request_error,authentication_error,permission_error,not_found_error,rate_limit_error,api_error,ResponsibleAIPolicyViolation"

capability_streaming: supported
capability_tool_use: supported
capability_structured_output: supported

fixture_streaming: tests/specs/AUR-019/fixtures/azure/streaming.json
fixture_tool_use: tests/specs/AUR-019/fixtures/azure/tool_use.json
fixture_structured_output: tests/specs/AUR-019/fixtures/azure/structured_output.json
