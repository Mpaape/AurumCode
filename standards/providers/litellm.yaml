# AurumCode provider contract: LiteLLM.
#
# Flat scalar keys only (no nested mappings) so tests/acceptance/AUR-019.sh
# and tests/integration/AUR-019_test.go can parse this file with one line-anchored
# rule per key instead of a general YAML walk. Values that are markdown
# links are double-quoted so this file also parses as strict YAML.
#
# This card fixes the contract; it implements no client and makes no network
# call. Every "supported" capability below MUST have a matching
# fixture_<capability> entry pointing at a recorded, non-secret fixture
# under tests/specs/AUR-019/fixtures/litellm/.

provider: LiteLLM
source: "[litellm v1.95.0](https://github.com/BerriAI/litellm/releases/tag/v1.95.0)"
version: v1.95.0
date: 2026-08-02

transport: sdk-call
wire_call: litellm.completion

wire_endpoint: /chat/completions
wire_method: POST
wire_content_type: application/json

auth_scheme: bearer
auth_header: Authorization
auth_format: "Bearer <LITELLM_VIRTUAL_KEY> against the proxy; per-provider api_key/env var (e.g. OPENAI_API_KEY) when calling completion() directly"

error_envelope: "maps every backend failure onto the openai Python exception hierarchy (Exception Mapping); no proxy-native envelope field"
error_taxonomy: "AuthenticationError,BadRequestError,RateLimitError,APIConnectionError,Timeout,ServiceUnavailableError,ContextWindowExceededError,ContentPolicyViolationError"

capability_streaming: supported
capability_tool_use: supported
capability_structured_output: supported

fixture_streaming: tests/specs/AUR-019/fixtures/litellm/streaming.json
fixture_tool_use: tests/specs/AUR-019/fixtures/litellm/tool_use.json
fixture_structured_output: tests/specs/AUR-019/fixtures/litellm/structured_output.json
