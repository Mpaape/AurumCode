name: Acceptance sample
# Historical acceptance evidence must not rot silently. Nightly, every
# acceptance of a card already `done` runs against the state the table in
# docs/specs/AUR-589.md records for it (0 = green, 69 = retired with a product
# reason), in shards, inside the same pinned Go image as CI. A new red shows
# up the next morning. The table is the single list: no card is named here.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acceptance-sample
  cancel-in-progress: false
jobs:
  shard:
    name: Done acceptances (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run the shard in the project Go image
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          docker run --rm
          -v "${GITHUB_WORKSPACE}:/src"
          -w /src
          -e "AUR589_SHARD=${SHARD}/6"
          -e GOFLAGS=-buildvcs=false
          -e GOCACHE=/tmp/gocache
          golang:1.27.1-alpine3.24@sha256:8a5910f31396cd4d89662f56c68b3ae31d374308270a1c3bd96672ee5ed43414
          sh -c 'apk add --no-cache bash git python3 >/dev/null
          && git config --global --add safe.directory /src
          && go mod download
          && bash tests/acceptance/AUR-589.sh AC-003
          && bash tests/acceptance/AUR-589.sh AC-001'
