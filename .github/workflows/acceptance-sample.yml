name: Acceptance sample
# Historical acceptance evidence must not rot silently. Nightly, a fixed sample
# of light acceptances from cards already `done` runs in series on the runner's
# own Go toolchain (no container engine involved).
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acceptance-sample
  cancel-in-progress: false
env:
  GOFLAGS: -buildvcs=false
  GOTOOLCHAIN: auto
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run the fixed sample in series
        run: |
          set -euo pipefail
          for card in AUR-547 AUR-556 AUR-562 AUR-565 AUR-567 AUR-574; do
            echo "::group::${card}"
            bash "tests/acceptance/${card}.sh" all
            echo "::endgroup::"
          done
