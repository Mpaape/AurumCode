name: Documentation Generation

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - '**.js'
      - '**.ts'
      - '**.py'
      - '**.cs'
      - '**.java'
      - '**.cpp'
      - '**.h'
      - '**.rs'
      - '**.sh'
      - '**.ps1'
      - 'docs/**'
      - '.github/workflows/documentation.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

# Root grants nothing: every job below declares its own minimal
# `permissions:` block, so there is no implicit inheritance left to
# guard against a job that forgets one.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Generate and Validate Documentation
    runs-on: ubuntu-latest
    # Three consecutive runs of this job vanished at exactly 15m01s with the log
    # unavailable, which is what a cancelled job looks like from outside. An
    # explicit ceiling turns that into a legible failure with a reason instead of
    # a disappearance. The generator reads LLM_API_KEY and LLM_BASE_URL, so a
    # network wait with empty credentials is the first thing to rule out.
    timeout-minutes: 20
    # The top-level grant is read-only, so the preview comment below fails with
    # "Resource not accessible by integration". Widen it here, on the one job
    # that writes, instead of at the workflow root.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for incremental detection

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install documentation tools
        run: |
          echo '=== Installing Documentation Extractors ==='

          # Ensure Go bin is in PATH
          export PATH="$HOME/go/bin:$PATH"

          # Go documentation tool
          go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest

          # JavaScript/TypeScript documentation tool
          npm install -g typedoc

          # Python documentation tool
          pip install pydoc-markdown

          # Verify installations
          echo "✓ gomarkdoc location:" && command -v gomarkdoc || echo "⚠ gomarkdoc not in PATH"
          echo "✓ gomarkdoc version:" && gomarkdoc --version || echo "⚠ gomarkdoc not found"
          echo "✓ typedoc version:" && typedoc --version || echo "⚠ typedoc not found"
          echo "✓ pydoc-markdown version:" && pydoc-markdown --version || echo "⚠ pydoc-markdown not found"

      - name: Extract documentation (Full Mode)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          PATH: ${{ env.PATH }}:$HOME/go/bin
        run: |
          echo '=== Running AurumCode Documentation Generator ==='
          echo 'Source Directory: .'
          echo 'Output Directory: .aurumcode (auto-generated)'
          echo 'Custom Pages: docs/ (user-written)'
          echo 'Mode: Full Generation'

          # Verify tools are accessible
          echo "=== Verifying Documentation Tools ==="
          echo "PATH: $PATH"
          echo ""
          echo "Go binary location:"
          # `which` is not installed on the current runner image, and this step
          # runs under `bash -e`: the bare `which go` exited 127 and killed the
          # job before the generator below ever ran. `command -v` is a shell
          # builtin, so it is always present. Kept bare on purpose - a missing
          # Go toolchain must still fail this step closed.
          command -v go
          echo ""
          echo "gomarkdoc location:"
          command -v gomarkdoc || echo "❌ gomarkdoc not found in PATH"
          echo ""
          echo "gomarkdoc version:"
          gomarkdoc --version 2>&1 || echo "❌ Cannot execute gomarkdoc"
          echo ""

          # Build and run the documentation generator
          echo "=== Running Documentation Generator ==="
          # `go run <file>` compiles only that file. This package is three files -
          # main.go, llmbudget.go and repo_code_execution.go - so naming main.go
          # alone left envLLMModel, resolveLLMBudget and
          # registerRepoCodeExecutingExtractors undefined. Name the package.
          go run ./cmd/regenerate-docs

          echo ""
          echo "=== Pipeline Complete ==="
          echo ""
          echo "📂 Directory structure:"
          ls -la .aurumcode/
          echo ""
          echo "📄 Generated files by type:"
          echo "  Go docs:"
          find .aurumcode -path "*/go/*.md" -type f 2>/dev/null || echo "    ❌ No Go docs found"
          echo "  Bash docs:"
          find .aurumcode -path "*/bash/*.md" -type f 2>/dev/null | wc -l | xargs echo "   "
          echo ""
          echo "📝 All markdown files:"
          find .aurumcode -name '*.md' -type f | head -20 || echo 'No markdown files'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: .aurumcode

      - name: Copy custom docs to Jekyll source
        run: |
          echo "Copying custom documentation from docs/ to .aurumcode/..."
          test -d docs && cp -r docs/* .aurumcode/ && echo "✅ Docs copied" || echo "⚠️ No docs/ found"

      - name: Install Jekyll dependencies
        working-directory: .aurumcode
        run: |
          echo "Installing Jekyll and dependencies..."
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      - name: Build Jekyll site
        working-directory: .aurumcode
        env:
          JEKYLL_ENV: production
        run: |
          echo "Building Jekyll site..."
          echo "Merging:"
          echo "  - .aurumcode/ (auto-generated API docs)"
          echo "  - ../docs/    (custom user pages)"
          bundle exec jekyll build --verbose

          echo "✅ Jekyll build complete!"
          echo "Checking generated files..."
          ls -la _site/ || echo "No _site directory created"

      - name: Check for generated files
        run: |
          if [ -z "$(ls -A .aurumcode/_site 2>/dev/null)" ]; then
            echo "❌ No documentation files generated"
            exit 1
          else
            echo "✅ Documentation files found:"
            find .aurumcode/_site -type f | head -20
            total=$(find .aurumcode/_site -type f | wc -l)
            echo "Total files: $total"
          fi

      - name: Validate HTML
        run: |
          if [ -f ".aurumcode/_site/index.html" ]; then
            echo "✅ Index page exists"
          else
            echo "⚠️ No index.html found"
          fi

      - name: Check for broken links
        if: false  # Disabled for now, can be enabled with link checker tool
        run: |
          echo "Link checking would run here"

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .aurumcode/_site/

      - name: Comment PR with documentation link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          # Built here, outside the script string, so nothing from the PR
          # (title, branch name, etc.) is ever interpolated into JS source by
          # the Actions expression engine before github-script runs it.
          COMMENT_BODY: |
            ## 📚 Documentation Build

            Documentation built successfully for this pull request.

            **Published site:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

            That link is the current production site, not a rendered preview of
            this PR's changes — GitHub Pages only deploys from `main`, and
            per-PR preview deployments are still an internal GitHub alpha
            (actions/deploy-pages#61). Your changes will appear at that URL
            once this PR merges to `main`.
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr_number = context.payload.pull_request.number;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr_number,
              body: process.env.COMMENT_BODY
            });

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  summary:
    name: Documentation Summary
    runs-on: ubuntu-latest
    needs: [build-docs, deploy]
    if: always()
    # Only step is a `run:` writing to $GITHUB_STEP_SUMMARY from the
    # `needs.*.result` and `github.*` contexts already available — no
    # `uses:` step, no checkout, no GITHUB_TOKEN API call. Nothing here
    # reads or writes the repo, so no permission is required.
    permissions: {}

    steps:
      - name: Create summary
        run: |
          echo "# Documentation Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Status" >> $GITHUB_STEP_SUMMARY
          echo "- Build & Validation: ${{ needs.build-docs.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Deploy: ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "## Deployment" >> $GITHUB_STEP_SUMMARY
            echo "🚀 Documentation deployed to: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" >> $GITHUB_STEP_SUMMARY
          fi
