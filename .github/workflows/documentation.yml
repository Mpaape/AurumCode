name: Documentation site

on:
  # Documentation must follow every change that can affect the product or its
  # explanation. There is intentionally no paths filter: a prompt, skill,
  # guide or site setting is also a published change.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate and validate site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.21'

      - name: Prepare clean site tree
        shell: bash
        env:
          SITE_ROOT: ${{ runner.temp }}/aurumcode-site
        run: |
          set -euo pipefail
          rm -rf "${SITE_ROOT}"
          mkdir -p "${SITE_ROOT}/_api" "${SITE_ROOT}/guides"
          cp .aurumcode/_config.yml "${SITE_ROOT}/_config.yml"
          cp .aurumcode/Gemfile "${SITE_ROOT}/Gemfile"
          cp .aurumcode/index.md "${SITE_ROOT}/index.md"
          # Public guides live at docs/*.md. Internal acceptance specs under
          # docs/specs/ stay in the repository and are deliberately not part
          # of the public site or of the editorial review corpus.
          find docs -maxdepth 1 -type f -name '*.md' -exec cp {} "${SITE_ROOT}/guides/" \;

      - name: Generate API pages and editorial review
        shell: bash
        env:
          AURUMCODE_OUTPUT_DIR: ${{ runner.temp }}/aurumcode-site/_api
          AURUMCODE_DOCS_DIR: ${{ runner.temp }}/aurumcode-site
          # The site must remain publishable before an LLM secret is added.
          # auto generates the review whenever both credentials exist and keeps
          # deterministic API/guides publication available otherwise.
          AURUMCODE_DOCS_REVIEW: auto
          AURUMCODE_DOCS_LANGUAGE: pt-BR
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          set -euo pipefail
          go run ./cmd/regenerate-docs

      - name: Validate site payload
        shell: bash
        env:
          SITE_ROOT: ${{ runner.temp }}/aurumcode-site
        run: |
          set -euo pipefail
          test -s "${SITE_ROOT}/index.md"
          test -s "${SITE_ROOT}/_config.yml"
          api_pages=$(find "${SITE_ROOT}/_api" -type f -name '*.md' | wc -l | tr -d ' ')
          if [ "${api_pages}" -eq 0 ]; then
            echo "::error::the deterministic API stage produced no Markdown pages"
            exit 1
          fi
          echo "API pages: ${api_pages}" >> "${GITHUB_STEP_SUMMARY}"
          if [ -s "${SITE_ROOT}/reviews/docs-review.md" ]; then
            echo "Editorial review: generated" >> "${GITHUB_STEP_SUMMARY}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "Editorial review: skipped (configure LLM_API_KEY and LLM_BASE_URL to enable it)" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Editorial review: not requested for this pull request" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ${{ runner.temp }}/aurumcode-site

      - name: Install site dependencies
        working-directory: ${{ runner.temp }}/aurumcode-site
        shell: bash
        run: |
          set -euo pipefail
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Build Jekyll site
        working-directory: ${{ runner.temp }}/aurumcode-site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination _site

      - name: Verify rendered root
        shell: bash
        env:
          SITE_ROOT: ${{ runner.temp }}/aurumcode-site
        run: |
          set -euo pipefail
          test -s "${SITE_ROOT}/_site/index.html"
          echo "Rendered site: ${SITE_ROOT}/_site/index.html" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/aurumcode-site/_site

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
