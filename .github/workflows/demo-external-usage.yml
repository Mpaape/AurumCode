# Demonstrates how an external repository consumes the AurumCode action.
# Manual trigger only; it is not part of any required check.
#
# Every input below is declared in action.yml. The previous revision also passed
# generate-welcome and build-jekyll, which the action no longer declares: the
# runner logs "Unexpected input(s)" for those and continues, so the job would
# have gone green while the Jekyll build it asked for never happened. Publishing
# is now requested through the publish input, which the action does declare.
name: Demo - External Repository Usage

on:
  workflow_dispatch:  # Manual trigger only for demo

# Minimum for this workflow; the deploy job widens it for itself only. Without
# this block the workflow inherits the repository default, which can be
# read/write on every scope.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A Pages deployment must not be cancelled halfway: the site would be left
  # serving a partially replaced tree.
  cancel-in-progress: false

jobs:
  generate-docs:
    name: Generate Documentation with AurumCode
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      docs-generated: ${{ steps.aurumcode.outputs.docs-generated }}
      docs-path: ${{ steps.aurumcode.outputs.docs-path }}

    steps:
      - name: Checkout target repository
        # Pinned to an immutable commit; the tag beside it is only a reading aid.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}  # Change to target repo
          fetch-depth: 0

      - name: Generate Documentation
        # The id is what makes steps.aurumcode.outputs.* resolve below.
        id: aurumcode
        # Pin the action to the commit you reviewed, never to a mutable branch:
        # @main lets a later push change what executes here.
        uses: Mpaape/AurumCode@6f584b5987c12399bc7a85571dad4a81e28005c8 # reviewed head of PR #1
        with:
          source-dir: '.'
          output-dir: 'docs'
          # artifact = build the Jekyll site and upload it as a Pages artifact
          # without deploying, so this job never holds pages: write. The action
          # refuses to publish a tree that has no index.md or no rendered
          # index.html, so an empty generation fails here.
          publish: 'artifact'
          # llm-api-key and llm-base-url are required together; the action warns
          # when only one is set. Uncomment both for the AI welcome page.
          # llm-api-key: ${{ secrets.LLM_API_KEY }}
          # llm-base-url: ${{ secrets.LLM_BASE_URL }}

      - name: Fail when the generator produced nothing
        # Outputs travel through env, never through ${{ }} inside the script.
        env:
          DOCS_GENERATED: ${{ steps.aurumcode.outputs.docs-generated }}
          DOCS_PATH: ${{ steps.aurumcode.outputs.docs-path }}
          LANGUAGES: ${{ steps.aurumcode.outputs.languages-detected }}
        run: |
          set -euo pipefail

          case "${DOCS_GENERATED}" in
            ''|*[!0-9]*)
              echo "::error::docs-generated='${DOCS_GENERATED}' is not a number - the action reported no result"
              exit 1
              ;;
          esac

          if [ "${DOCS_GENERATED}" -eq 0 ]; then
            echo "::error::the generator wrote 0 markdown files under '${DOCS_PATH}' - refusing to report a successful demo run"
            exit 1
          fi

          echo "${DOCS_GENERATED} markdown files under ${DOCS_PATH} (languages: ${LANGUAGES:-none})"

      - name: Upload the generated markdown
        # Pinned to an immutable commit; the tag beside it is only a reading
        # aid. The rendered site already travels as the Pages artifact that
        # publish: artifact uploaded; this second upload keeps the raw markdown
        # for inspection, taking its path from the action's own output instead
        # of a hard-coded guess.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: documentation-markdown
          path: ${{ steps.aurumcode.outputs.docs-path }}
          if-no-files-found: error
          retention-days: 30

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: generate-docs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # The only job here that writes anything, and it writes only to Pages.
    # Requires Settings > Pages > Source = "GitHub Actions". peaceiris/actions-gh-pages
    # is deliberately gone: it pinned to a mutable major tag and needed
    # contents: write to force-push a gh-pages branch, while the official action
    # below is pinned to a commit and touches no repository content.
    permissions:
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy the Pages artifact
        id: deployment
        # Pinned to an immutable commit; the tag beside it is only a reading aid.
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
