name: AurumCode reusable code review

on:
  workflow_call:
    inputs:
      model:
        description: Optional model id. Empty lets the configured endpoint choose.
        required: false
        type: string
        default: ''
      provider:
        description: Optional LLM provider profile (LLM_PROVIDER; see docs/provedores.md), e.g. openai, azure-openai, anthropic, google, bedrock, litellm, openrouter, opencode, ollama. Empty keeps the generic OpenAI-compatible endpoint.
        required: false
        type: string
        default: ''
      fallback_1_provider:
        description: Optional provider profile of fallback 1 (LLM_FALLBACK_1_PROVIDER; see docs/provedores.md). Tried, in order, only when the providers before it fail. Empty with the LLM_FALLBACK_1_BASE_URL and LLM_FALLBACK_1_API_KEY secrets set uses the generic OpenAI-compatible endpoint.
        required: false
        type: string
        default: ''
      fallback_1_model:
        description: Optional model id of fallback 1; the primary's model is never reused for a fallback.
        required: false
        type: string
        default: ''
      fallback_2_provider:
        description: Optional provider profile of fallback 2 (LLM_FALLBACK_2_PROVIDER; see docs/provedores.md). Tried, in order, only when the providers before it fail. Empty with the LLM_FALLBACK_2_BASE_URL and LLM_FALLBACK_2_API_KEY secrets set uses the generic OpenAI-compatible endpoint.
        required: false
        type: string
        default: ''
      fallback_2_model:
        description: Optional model id of fallback 2; the primary's model is never reused for a fallback.
        required: false
        type: string
        default: ''
      publication:
        description: comments or review; the repository config is used when omitted.
        required: false
        type: string
        default: ''
      inline_comments:
        description: Add eligible findings as inline comments on changed lines.
        required: false
        type: boolean
        default: false
      security:
        description: Include the deterministic security pass.
        required: false
        type: boolean
        default: true
      changelog:
        description: Derive the suggested next version and changelog entry from the reviewed commits and expose them as outputs.
        required: false
        type: boolean
        default: false
      policy_repository:
        description: Optional owner/repo of a central policy (AUR-518). When set, this workflow checks it out itself (read-only, no credentials persisted) into .aurumcode-policy and uses it as the policy directory. There is no policy_path input here on purpose -- in a workflow_call job the only directories this job can reach are the tool checkout and the reviewed pull request's own head, so accepting an arbitrary "already checked out" path would let the PR under review name its own policy. Empty keeps today's behavior.
        required: false
        type: string
        default: ''
      policy_ref:
        description: Branch, tag or SHA of policy_repository to check out. Empty checks out that repository's default branch. Ignored when policy_repository is empty.
        required: false
        type: string
        default: ''
    secrets:
      LLM_API_KEY:
        description: API key for the configured OpenAI-compatible service.
        required: true
      LLM_BASE_URL:
        description: Base URL of the LLM service (with a provider profile, the endpoint that profile talks to).
        required: true
      LLM_FALLBACK_1_API_KEY:
        description: Optional API key of fallback 1. A fallback never receives the primary's key.
        required: false
      LLM_FALLBACK_1_BASE_URL:
        description: Optional base URL of fallback 1 (with a profile that has a default URL, may be empty).
        required: false
      LLM_FALLBACK_2_API_KEY:
        description: Optional API key of fallback 2. A fallback never receives the primary's key.
        required: false
      LLM_FALLBACK_2_BASE_URL:
        description: Optional base URL of fallback 2 (with a profile that has a default URL, may be empty).
        required: false
      DTRACK_API_KEY:
        description: Optional Dependency-Track API key (AUR-555). Only read when quality_gates.ssor_dtrack is enabled and names this variable in api_key_secret.
        required: false
      DTRACK_PROJECT_ID:
        description: Optional Dependency-Track project id (AUR-555). Only read when quality_gates.ssor_dtrack is enabled and names this variable in project_id_secret.
        required: false
      AURUMCODE_POLICY_TOKEN:
        description: Optional token that reads a private or internal policy_repository (contents:read on that repository only). Empty uses github.token, which reads a public policy repository.
        required: false

jobs:
  review:
    name: Review pull request
    # A scheduled run of the caller has no pull request: it runs the
    # dependency scan job below instead.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.review.outputs.version }}
      changelog_bump: ${{ steps.review.outputs.changelog_bump }}
      changelog: ${{ steps.review.outputs.changelog }}
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      checks: read
      # AUR-521: deliberately NOT security-events: write. A reusable
      # workflow's own `permissions:` block cannot ELEVATE what its
      # caller grants -- GitHub refuses to even start a workflow_call job
      # that declares a permission the caller's job token does not
      # already have, which would break every existing caller of this
      # workflow (code-review.yml, docs/site/workflow.yml, every example)
      # the moment this key were added here. The SARIF document is
      # uploaded as a plain job artifact below (actions/upload-artifact,
      # no special permission needed); a caller that wants it in code
      # scanning runs a SEPARATE job, in its own workflow, that grants
      # itself security-events: write and uploads from the downloaded
      # artifact -- see docs/configuration.md's "Trilha de auditoria e
      # SARIF" section for the exact job.
    concurrency:
      group: aurumcode-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Check provider configuration
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${LLM_API_KEY}" ] || [ -z "${LLM_BASE_URL}" ]; then
            echo "::error title=AurumCode sem provedor de modelo::Faltam os secrets LLM_API_KEY e LLM_BASE_URL; a revisão não roda e o status aurumcode/policy-gate não é publicado (com o status exigido na proteção da branch, a PR fica bloqueada esperando). Cadastre os dois em Settings > Secrets and variables > Actions do repositório (ou da organização) e repasse-os ao workflow reutilizável em secrets: (ou com secrets: inherit)."
            exit 1
          fi

      - name: Verify tool version
        env:
          TOOL_REPOSITORY: ${{ job.workflow_repository }}
          TOOL_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          # job identifies this reusable workflow; github identifies its caller.
          # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context
          # AUR-493-VERIFY-BEGIN
          if [[ ! "$TOOL_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ||
                ! "$TOOL_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Cannot identify the AurumCode workflow version. This workflow requires GitHub.com job.workflow_sha support."
            exit 1
          fi
          # AUR-493-VERIFY-END

      - name: Checkout AurumCode
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .aurumcode-tool
          fetch-depth: 1

      - name: Resolve AurumCode version
        id: tool_version
        env:
          TOOL_SHA: ${{ job.workflow_sha }}
          TOOL_DIR: .aurumcode-tool
        run: |
          set -euo pipefail
          # AUR-611-VERSION-BEGIN
          # The version the image stamps into the binary (AUR-611): the
          # tool's exact release tag when one points at TOOL_SHA, else its
          # short SHA. ls-remote reads only the tag list, so the shallow
          # checkout stays shallow; a failed lookup falls back to the short
          # SHA and never fails the job.
          version="${TOOL_SHA:0:12}"
          tags="$(git -C "$TOOL_DIR" ls-remote --tags origin 2>/dev/null)" || tags=''
          tag="$(printf '%s\n' "$tags" | awk -v sha="$TOOL_SHA" '$1 == sha { print $2 }' |
            sed -e 's|^refs/tags/||' -e 's|\^{}$||' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -uV | tail -n 1)" || tag=''
          version="${tag:-$version}"
          if [[ ! "$version" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+|[0-9a-f]{12})$ ]]; then
            echo "::error::Cannot resolve the AurumCode version from TOOL_SHA"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "AurumCode version: $version"
          # AUR-611-VERSION-END

      - name: Build AurumCode image
        env:
          AURUMCODE_VERSION: ${{ steps.tool_version.outputs.version }}
        run: docker build --build-arg AURUMCODE_VERSION="$AURUMCODE_VERSION" --tag aurumcode-review .aurumcode-tool

      # The secrets engine (gitleaks) runs from the image at the digest the
      # scanners lock pins: pulling by digest fails if the registry serves
      # other bytes, and the installed binary must report the lock's version
      # (the engine refuses any other version as an inconclusive scan).
      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          lock=.aurumcode-tool/.board/bootstrap/locks/scanners.yml
          image="$(sed -n 's/^secrets_scanner_image: //p' "$lock")"
          version="$(sed -n 's/^secrets_scanner_version: //p' "$lock")"
          if [[ ! "$image" =~ @sha256:[0-9a-f]{64}$ || -z "$version" ]]; then
            echo "::error::scanners lock does not pin gitleaks by digest"
            exit 1
          fi
          docker pull "$image"
          printf 'FROM %s AS gitleaks\nFROM aurumcode-review\nCOPY --from=gitleaks /usr/bin/gitleaks /usr/local/bin/gitleaks\n' "$image" |
            docker build --tag aurumcode-review -
          got="$(docker run --rm --entrypoint gitleaks aurumcode-review version)"
          if [ "$got" != "$version" ]; then
            echo "::error::gitleaks $got is not the locked $version"
            exit 1
          fi

      - name: Checkout pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: .aurumcode-target
          persist-credentials: false
          # Full history: gitleaks scans base..head, and a shallow clone
          # would cut the range (the engine refuses one as inconclusive).
          fetch-depth: 0

      - name: Checkout central policy
        if: ${{ inputs.policy_repository != '' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.policy_repository }}
          ref: ${{ inputs.policy_ref }}
          path: .aurumcode-policy
          # A private or internal policy repository is not readable with this
          # repository's github.token: AURUMCODE_POLICY_TOKEN (a fine-grained
          # token or GitHub App token with contents:read on the policy
          # repository only) reads it. Empty keeps github.token, which reads
          # a public policy repository.
          token: ${{ secrets.AURUMCODE_POLICY_TOKEN || github.token }}
          persist-credentials: false
          fetch-depth: 1

      - name: Collect available CI context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_CONTEXT_FILE: ${{ runner.temp }}/aurumcode-ci.json
        run: |
          set +e
          gh pr checks "${PR_NUMBER}" --repo "${REPOSITORY}" --json name,state,workflow,link > "${CI_CONTEXT_FILE}"
          set -e
          # gh exits 1 for failed checks and 8 for pending checks; their JSON
          # remains useful review evidence. Only discard malformed output.
          if ! jq -e 'type == "array"' "${CI_CONTEXT_FILE}" >/dev/null 2>&1; then
            printf '%s\n' '[]' > "${CI_CONTEXT_FILE}"
          fi

      # AUR-549: `aurumcode sbom` itself resolves
      # quality_gates.ssor_dtrack.sbom_generator (repo or central policy,
      # same precedence a review uses, ApplyCentralPolicy) and already
      # exits 0 doing nothing when that section is not declared -- so this
      # step runs UNCONDITIONALLY (card v3 review: a text grep here would
      # only duplicate that decision, with a real chance of disagreeing
      # with it) and pays only for extracting the (already-built)
      # `aurumcode` binary and generating a wrapper script when a
      # repository never opted in; the actual `docker run` of the Trivy
      # image only happens when aurumcode itself decides to generate.
      #
      # The `aurumcode` binary is extracted from the aurumcode-review image
      # already built above (same reviewed source, no second build/
      # toolchain on the runner). Trivy itself NEVER runs as a locally
      # installed binary and NEVER as `latest`: --trivy-bin points at a
      # small wrapper this step generates, which re-plays trivy's own argv
      # inside `docker run` against the DIGEST-PINNED image named by
      # vuln_scanner_image in .board/bootstrap/locks/scanners.yml (the same
      # lock file AUR-362 already seals). See docs/configuration.md's "SBOM
      # CycloneDX com Trivy" section for why this step calls `docker run`
      # directly from the RUNNER (not from inside aurumcode-review's own
      # container): a nested `docker run` through a mounted docker socket
      # would need host-path translation this step avoids by never nesting
      # in the first place.
      #
      # The wrapper NEVER bind-mounts the checked-out workspace read-write:
      # trivy's own --output inside the container always lands in a fresh
      # $RUNNER_TEMP scratch directory (mounted read-write, outside
      # .aurumcode-target entirely), and the wrapper itself -- running on
      # the runner, not in the container -- moves the finished file into
      # the path `aurumcode sbom` actually asked for once the container
      # exits. The scanned filesystem mount (fs mode) stays read-only, as
      # it always was.
      # AUR-555: this step now runs BEFORE "Run and publish code review".
      # The review's ssor_dtrack gate (AUR-550) reads the SBOM from
      # quality_gates.ssor_dtrack.sbom_generator.output_file, resolved
      # against the reviewed checkout; `aurumcode sbom --repo .` (cwd
      # .aurumcode-target) writes exactly that path, and the review
      # container mounts the same checkout at /github/workspace (its cwd),
      # so both sides name the same file with no extra flag. It holds no
      # Dependency-Track secret: only the review step receives them.
      - name: Generate SBOM (Trivy, AUR-549)
        working-directory: .aurumcode-target
        env:
          SCANNERS_LOCK: ${{ github.workspace }}/.aurumcode-tool/.board/bootstrap/locks/scanners.yml
          POLICY_REPOSITORY: ${{ inputs.policy_repository }}
        run: |
          set -euo pipefail
          image="$(sed -n 's/^vuln_scanner_image:[[:space:]]*//p' "${SCANNERS_LOCK}" | head -n1)"
          case "${image}" in
            *@sha256:*) ;;
            *) echo "::error::AUR-549: vuln_scanner_image in scanners.yml is not digest-pinned"; exit 1 ;;
          esac

          wrapper="${RUNNER_TEMP}/trivy-docker.sh"
          cat > "${wrapper}" <<'WRAPPER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          mode="${1:-}"; shift || true
          format=''; output=''; target=''
          while (( $# > 0 )); do
            case "$1" in
              --format) format="${2:-}"; shift 2 ;;
              --output) output="${2:-}"; shift 2 ;;
              *) target="$1"; shift ;;
            esac
          done
          outbase="$(basename -- "$output")"
          scratch="$(mktemp -d "${RUNNER_TEMP:-/tmp}/trivy-docker.XXXXXX")"
          trap 'rm -rf "$scratch"' EXIT
          case "$mode" in
            fs)
              targetabs="$(cd "$target" && pwd -P)"
              docker run --rm -v "$targetabs:/workspace:ro" -v "$scratch:/out" __TRIVY_IMAGE__ fs --format "$format" --output "/out/$outbase" /workspace
              ;;
            image)
              docker run --rm -v "$scratch:/out" __TRIVY_IMAGE__ image --format "$format" --output "/out/$outbase" "$target"
              ;;
            *)
              echo "trivy-docker: unknown mode $mode" >&2
              exit 2
              ;;
          esac
          mv -- "$scratch/$outbase" "$output"
          WRAPPER
          sed -i "s|__TRIVY_IMAGE__|${image}|g" "${wrapper}"
          chmod +x "${wrapper}"

          bin_id="$(docker create aurumcode-review)"
          docker cp "${bin_id}:/app/aurumcode" "${RUNNER_TEMP}/aurumcode"
          docker rm "${bin_id}" >/dev/null
          chmod +x "${RUNNER_TEMP}/aurumcode"

          sbom_args=(sbom --repo . --trivy-bin "${wrapper}")
          if [ -n "${POLICY_REPOSITORY}" ]; then
            sbom_args+=(--politica "${GITHUB_WORKSPACE}/.aurumcode-policy")
          fi
          "${RUNNER_TEMP}/aurumcode" "${sbom_args[@]}"

      # The lint engine (govet) vets with GOPROXY=off and never downloads a
      # module during the review. A Go repository's modules are downloaded
      # here, before it, by the image's own pinned toolchain
      # (GOTOOLCHAIN=local: a `toolchain` line in the pull request never
      # fetches another Go), with no secret in the environment, into a cache
      # the review step mounts. A failed download is only a warning here:
      # with govet enabled the review then reports lint_execution_error and
      # the gate fails closed.
      - name: Prefetch Go modules for the lint engine
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/aurumcode-gomod"
          if [ ! -f .aurumcode-target/go.mod ]; then
            exit 0
          fi
          docker run --rm --entrypoint go \
            -v "${GITHUB_WORKSPACE}/.aurumcode-target:/github/workspace:ro" \
            -v "${RUNNER_TEMP}/aurumcode-gomod:/go/pkg/mod" \
            -w /github/workspace -e GOTOOLCHAIN=local -e GOFLAGS= \
            aurumcode-review mod download ||
            echo "::warning::go mod download failed; an enabled govet engine will be inconclusive"

      - name: Run and publish code review
        id: review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          # AUR-521: the reusable workflow's OWN version, distinct from
          # GITHUB_SHA (the commit under review above). Forwarded under a
          # name GitHub Actions does not reserve: GITHUB_SHA (and, per the
          # same reservation documented for AUR-504, very likely
          # GITHUB_WORKFLOW_SHA too) cannot be overridden by a step's own
          # env: block on a pull_request event, so this uses
          # AURUMCODE_WORKFLOW_SHA instead. The audit record's workflow_sha
          # field falls back to GITHUB_SHA only when this is absent (e.g. a
          # caller invoking the CLI directly, outside this workflow).
          AURUMCODE_WORKFLOW_SHA: ${{ job.workflow_sha }}
          AURUMCODE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AURUMCODE_PR_PERMISSION_MODE: endpoint
          # The login github.token publishes as: only its comments' round
          # markers are read by the next round (AUR-494).
          AURUMCODE_PUBLISHER_LOGIN: github-actions[bot]
          AURUMCODE_CI_CONTEXT_FILE: /tmp/aurumcode-ci.json
          AURUMCODE_OUTPUT_FILE: /aurumcode-out/aurumcode-changelog-output
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ inputs.model }}
          LLM_PROVIDER: ${{ inputs.provider }}
          LLM_FALLBACK_1_PROVIDER: ${{ inputs.fallback_1_provider }}
          LLM_FALLBACK_1_MODEL: ${{ inputs.fallback_1_model }}
          LLM_FALLBACK_1_API_KEY: ${{ secrets.LLM_FALLBACK_1_API_KEY }}
          LLM_FALLBACK_1_BASE_URL: ${{ secrets.LLM_FALLBACK_1_BASE_URL }}
          LLM_FALLBACK_2_PROVIDER: ${{ inputs.fallback_2_provider }}
          LLM_FALLBACK_2_MODEL: ${{ inputs.fallback_2_model }}
          LLM_FALLBACK_2_API_KEY: ${{ secrets.LLM_FALLBACK_2_API_KEY }}
          LLM_FALLBACK_2_BASE_URL: ${{ secrets.LLM_FALLBACK_2_BASE_URL }}
          PUBLICATION: ${{ inputs.publication }}
          INLINE_COMMENTS: ${{ inputs.inline_comments }}
          SECURITY: ${{ inputs.security }}
          CHANGELOG: ${{ inputs.changelog }}
          POLICY_REPOSITORY: ${{ inputs.policy_repository }}
          # AUR-555: optional Dependency-Track credentials, exposed ONLY to
          # this step (the one that runs the ssor_dtrack gate). The names
          # match the default api_key_secret/project_id_secret of
          # quality_gates.ssor_dtrack; empty when the caller passes none.
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
          DTRACK_PROJECT_ID: ${{ secrets.DTRACK_PROJECT_ID }}
        run: |
          set -euo pipefail
          # A deterministic pass is not a completed code review. The CLI
          # publishes its honest inconclusive comment, then fails this job.
          args=(review --pr "${PR_NUMBER}" --repo "${REPOSITORY}" --publicar --check --exigir-qualidade)
          if [ -n "${PUBLICATION}" ]; then
            args+=(--modo-publicacao "${PUBLICATION}")
          fi
          if [ "${INLINE_COMMENTS}" = true ]; then
            args+=(--na-linha)
          fi
          if [ "${SECURITY}" = true ]; then
            args+=(--seguranca)
          fi
          if [ "${CHANGELOG}" = true ]; then
            args+=(--changelog)
          fi
          # AUR-518: policy_repository, checked out above into
          # .aurumcode-policy, is the only source of a policy this workflow
          # accepts -- there is no policy_path input here (see that input's
          # own comment above). Unset keeps today's behavior unchanged -- no
          # --politica, no extra mount.
          policy_dir=""
          if [ -n "${POLICY_REPOSITORY}" ]; then
            policy_dir=".aurumcode-policy"
          fi
          if [ -n "${policy_dir}" ]; then
            args+=(--politica /github/policy)
          fi
          # AUR-521: the compliance audit record and SARIF document, always
          # written by this reusable workflow (the org's required policy
          # gate is itself a compliance control, see docs/specs/AUR-521.md)
          # -- never by the standalone action.yml, which has no equivalent
          # mount point for them.
          args+=(--auditoria /aurumcode-out/aurumcode-audit.json --sarif /aurumcode-out/aurumcode-review.sarif)
          # The files the review writes live in a directory mounted outside
          # the container's /tmp: /tmp is sticky and world-writable, and with
          # the kernel's fs.protected_regular an open(O_CREAT) of a file there
          # owned by another uid (the runner's, through a file bind mount)
          # fails with EACCES even for root -- the audit and SARIF were then
          # never written (audit_write_failed / sarif_write_failed).
          out_dir="${RUNNER_TEMP}/aurumcode-out"
          mkdir -p "${out_dir}"
          rm -f "${out_dir}/aurumcode-changelog-output" "${out_dir}/aurumcode-audit.json" "${out_dir}/aurumcode-review.sarif"
          docker_args=(run --rm
            -v "${GITHUB_WORKSPACE}/.aurumcode-target:/github/workspace:ro"
            -w /github/workspace
            -e GITHUB_TOKEN
            -e GITHUB_SHA
            -e AURUMCODE_WORKFLOW_SHA
            -e AURUMCODE_BASE_SHA
            -e AURUMCODE_PR_PERMISSION_MODE
            -e AURUMCODE_PUBLISHER_LOGIN
            # git inside the container runs as another user than the
            # checkout's owner; command-scope safe.directory lets the
            # secrets engine read the history of the read-only mount.
            -e GIT_CONFIG_COUNT=1
            -e GIT_CONFIG_KEY_0=safe.directory
            -e GIT_CONFIG_VALUE_0=/github/workspace
            -e LLM_API_KEY
            -e LLM_BASE_URL
            -e LLM_MODEL
            -e LLM_PROVIDER
            -e LLM_FALLBACK_1_PROVIDER
            -e LLM_FALLBACK_1_MODEL
            -e LLM_FALLBACK_1_API_KEY
            -e LLM_FALLBACK_1_BASE_URL
            -e LLM_FALLBACK_2_PROVIDER
            -e LLM_FALLBACK_2_MODEL
            -e LLM_FALLBACK_2_API_KEY
            -e LLM_FALLBACK_2_BASE_URL
            -e AURUMCODE_CI_CONTEXT_FILE
            -e AURUMCODE_OUTPUT_FILE
            -e DTRACK_API_KEY
            -e DTRACK_PROJECT_ID
            -v "${RUNNER_TEMP}/aurumcode-ci.json:/tmp/aurumcode-ci.json:ro"
            -v "${out_dir}:/aurumcode-out"
            -v "${RUNNER_TEMP}/aurumcode-gomod:/go/pkg/mod"
          )
          if [ -n "${policy_dir}" ]; then
            docker_args+=(-v "${GITHUB_WORKSPACE}/${policy_dir}:/github/policy:ro")
          fi
          docker_args+=(aurumcode-review "${args[@]}")
          review_rc=0
          docker "${docker_args[@]}" || review_rc=$?
          # The container writes as root; hand the files to the runner's uid
          # so the steps below can read and upload them, then keep the
          # review's own exit status.
          docker run --rm --entrypoint chown -v "${out_dir}:/aurumcode-out" aurumcode-review \
            -R "$(id -u):$(id -g)" /aurumcode-out
          if [ "${review_rc}" -ne 0 ]; then
            exit "${review_rc}"
          fi
          if [ -s "${RUNNER_TEMP}/aurumcode-out/aurumcode-changelog-output" ]; then
            cat "${RUNNER_TEMP}/aurumcode-out/aurumcode-changelog-output" >> "$GITHUB_OUTPUT"
          fi

      # AUR-555: signing runs only after the review step SUCCEEDED, so a
      # rejected (or inconclusive-blocked) review never signs its artifacts.
      # AUR-551: installs the `cosign` binary onto the runner's own PATH,
      # pinned by COMMIT SHA (never a branch/tag of the installer action
      # itself, same rule the "Verify tool version" step already applies
      # to AurumCode's own SHA) and by a fixed `cosign-release` (never
      # "latest" -- a mutable release could change what every repository
      # using this workflow signs with, unreviewed). This step runs
      # unconditionally and costs nothing when supply_chain is not
      # configured: `aurumcode sign` below is the one that decides,
      # exactly like the SBOM step above already decides for Trivy.
      - name: Install cosign (AUR-551)
        if: ${{ success() && steps.review.outcome == 'success' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      # AUR-551: `aurumcode sign` itself resolves
      # quality_gates.supply_chain (repo or central policy, the same
      # precedence `aurumcode sbom` above already uses) and exits 0 doing
      # nothing when that section is not declared -- so, like the SBOM
      # step, this one runs UNCONDITIONALLY and only pays for extracting
      # the already-built `aurumcode` binary when a repository never
      # opted in.
      #
      # Signing is keyless: cosign authenticates through the Actions
      # runner's own OIDC identity (no --key, no secret AurumCode
      # manages). That needs `id-token: write`, which this REUSABLE
      # workflow can never declare for itself -- see docs/configuration.md's
      # "Assinatura com Sigstore/Cosign" section for why (the same
      # workflow_call limitation already documented for
      # security-events: write above). A caller that enables
      # sign_sbom/sign_artifacts without granting id-token: write to the
      # job that calls this workflow gets a loud Cosign/Fulcio failure
      # here, never a silent skip.
      - name: Sign SBOM and image (Cosign, AUR-551)
        if: ${{ success() && steps.review.outcome == 'success' }}
        working-directory: .aurumcode-target
        env:
          POLICY_REPOSITORY: ${{ inputs.policy_repository }}
        run: |
          set -euo pipefail
          bin_id="$(docker create aurumcode-review)"
          docker cp "${bin_id}:/app/aurumcode" "${RUNNER_TEMP}/aurumcode"
          docker rm "${bin_id}" >/dev/null
          chmod +x "${RUNNER_TEMP}/aurumcode"

          sign_args=(sign --repo . --cosign-bin cosign)
          if [ -n "${POLICY_REPOSITORY}" ]; then
            sign_args+=(--politica "${GITHUB_WORKSPACE}/.aurumcode-policy")
          fi
          "${RUNNER_TEMP}/aurumcode" "${sign_args[@]}"

      # AUR-521: the two compliance files may be absent or empty on a run
      # that never reached the point where the CLI writes them (a usage
      # error, or the --pr early-provider-failure gap AUR-537 tracks). A
      # 0-byte file is not a SARIF document and must never be uploaded as
      # one; this check makes both upload steps below no-ops on that file
      # instead of letting upload-sarif fail the job on invalid input.
      - name: Check compliance artifacts are non-empty
        if: always()
        id: artifacts
        run: |
          set -euo pipefail
          if [ -s "${RUNNER_TEMP}/aurumcode-out/aurumcode-review.sarif" ]; then
            echo "sarif=true" >> "$GITHUB_OUTPUT"
          else
            echo "sarif=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -s "${RUNNER_TEMP}/aurumcode-out/aurumcode-audit.json" ]; then
            echo "audit=true" >> "$GITHUB_OUTPUT"
          else
            echo "audit=false" >> "$GITHUB_OUTPUT"
          fi

      # if: always() -- a gate breach fails the "Run and publish code
      # review" step (exit 1/3 above), and the whole point of uploading
      # these is that a FAILING gate still produces evidence; without
      # always() both artifacts would be skipped exactly on the runs that
      # most need them. Uploaded as plain job artifacts -- NOT via
      # github/codeql-action/upload-sarif here -- because that action
      # needs security-events: write, which this reusable workflow cannot
      # grant itself (see the job's own `permissions:` comment above). A
      # caller that wants the SARIF in code scanning downloads this
      # artifact in a second job; see docs/configuration.md.
      - name: Upload SARIF document
        if: always() && steps.artifacts.outputs.sarif == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurumcode-sarif-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/aurumcode-out/aurumcode-review.sarif

      - name: Upload compliance audit record
        if: always() && steps.artifacts.outputs.audit == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurumcode-audit-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/aurumcode-out/aurumcode-audit.json

      # AUR-551: the SBOM's own signature bundle (<sbom>.sigstore.json,
      # written by the "Sign SBOM and image" step above, next to whatever
      # quality_gates.ssor_dtrack.sbom_generator.output_file names, when
      # sign_sbom is on) must actually leave the runner to be verifiable
      # by anyone else -- the Outcome's own "a assinatura e verificavel"
      # means nothing if the bundle only ever existed inside this job's
      # ephemeral filesystem. The glob matches wherever output_file
      # places it under .aurumcode-target; if-no-files-found: ignore
      # keeps a run with supply_chain/sign_sbom never enabled (so no
      # bundle was ever written) from failing on an empty match, exactly
      # like the "Check compliance artifacts" step above does for the
      # SARIF/audit files.
      - name: Upload SBOM signature bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurumcode-sbom-bundle-${{ github.event.pull_request.number }}
          path: .aurumcode-target/**/*.sigstore.json
          if-no-files-found: ignore

  # The scheduled dependency scan. A reusable workflow cannot declare its own
  # trigger: the caller adds `schedule:` to its `on:` and this job runs on
  # those runs only, over the caller's default branch (the ref a scheduled
  # run checks out), against the OSV base as it is today. The SARIF has its
  # own category (automationDetails.id aurumcode/dependencies-scheduled/)
  # and is uploaded as an artifact only when the scan was conclusive: an
  # inconclusive scan exits 1 and writes no SARIF, so the caller's
  # code-scanning upload (which needs security-events: write, a permission
  # this workflow cannot grant itself) never sends an empty document that
  # would close the open alerts. See docs/configuration.md, "Varredura
  # agendada de dependencias".
  dependencies:
    name: Scheduled dependency scan
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: aurumcode-dependencies-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Check provider configuration
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${LLM_API_KEY}" ] || [ -z "${LLM_BASE_URL}" ]; then
            echo "::error title=AurumCode sem provedor de modelo::Faltam os secrets LLM_API_KEY e LLM_BASE_URL; a varredura agendada de dependências não roda e este job falha. Cadastre os dois em Settings > Secrets and variables > Actions do repositório (ou da organização) e repasse-os ao workflow reutilizável em secrets: (ou com secrets: inherit)."
            exit 1
          fi

      - name: Verify tool version
        env:
          TOOL_REPOSITORY: ${{ job.workflow_repository }}
          TOOL_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TOOL_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ||
                ! "$TOOL_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Cannot identify the AurumCode workflow version. This workflow requires GitHub.com job.workflow_sha support."
            exit 1
          fi

      - name: Checkout AurumCode
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .aurumcode-tool
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve AurumCode version
        id: tool_version
        env:
          TOOL_SHA: ${{ job.workflow_sha }}
          TOOL_DIR: .aurumcode-tool
        run: |
          set -euo pipefail
          # AUR-611-VERSION-BEGIN
          # The version the image stamps into the binary (AUR-611): the
          # tool's exact release tag when one points at TOOL_SHA, else its
          # short SHA. ls-remote reads only the tag list, so the shallow
          # checkout stays shallow; a failed lookup falls back to the short
          # SHA and never fails the job.
          version="${TOOL_SHA:0:12}"
          tags="$(git -C "$TOOL_DIR" ls-remote --tags origin 2>/dev/null)" || tags=''
          tag="$(printf '%s\n' "$tags" | awk -v sha="$TOOL_SHA" '$1 == sha { print $2 }' |
            sed -e 's|^refs/tags/||' -e 's|\^{}$||' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -uV | tail -n 1)" || tag=''
          version="${tag:-$version}"
          if [[ ! "$version" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+|[0-9a-f]{12})$ ]]; then
            echo "::error::Cannot resolve the AurumCode version from TOOL_SHA"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "AurumCode version: $version"
          # AUR-611-VERSION-END

      - name: Build AurumCode image
        env:
          AURUMCODE_VERSION: ${{ steps.tool_version.outputs.version }}
        run: docker build --build-arg AURUMCODE_VERSION="$AURUMCODE_VERSION" --tag aurumcode-review .aurumcode-tool

      - name: Checkout default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          path: .aurumcode-target
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout central policy
        if: ${{ inputs.policy_repository != '' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.policy_repository }}
          ref: ${{ inputs.policy_ref }}
          path: .aurumcode-policy
          # A private or internal policy repository is not readable with this
          # repository's github.token: AURUMCODE_POLICY_TOKEN (a fine-grained
          # token or GitHub App token with contents:read on the policy
          # repository only) reads it. Empty keeps github.token, which reads
          # a public policy repository.
          token: ${{ secrets.AURUMCODE_POLICY_TOKEN || github.token }}
          persist-credentials: false
          fetch-depth: 1

      - name: Scan dependencies
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ inputs.model }}
          LLM_PROVIDER: ${{ inputs.provider }}
          LLM_FALLBACK_1_PROVIDER: ${{ inputs.fallback_1_provider }}
          LLM_FALLBACK_1_MODEL: ${{ inputs.fallback_1_model }}
          LLM_FALLBACK_1_API_KEY: ${{ secrets.LLM_FALLBACK_1_API_KEY }}
          LLM_FALLBACK_1_BASE_URL: ${{ secrets.LLM_FALLBACK_1_BASE_URL }}
          LLM_FALLBACK_2_PROVIDER: ${{ inputs.fallback_2_provider }}
          LLM_FALLBACK_2_MODEL: ${{ inputs.fallback_2_model }}
          LLM_FALLBACK_2_API_KEY: ${{ secrets.LLM_FALLBACK_2_API_KEY }}
          LLM_FALLBACK_2_BASE_URL: ${{ secrets.LLM_FALLBACK_2_BASE_URL }}
          POLICY_REPOSITORY: ${{ inputs.policy_repository }}
        run: |
          set -euo pipefail
          out_dir="${RUNNER_TEMP}/aurumcode-out"
          mkdir -p "${out_dir}"
          rm -f "${out_dir}/aurumcode-dependencies.sarif"
          args=(dependencies --repo /github/workspace --sarif /aurumcode-out/aurumcode-dependencies.sarif)
          docker_args=(run --rm
            -v "${GITHUB_WORKSPACE}/.aurumcode-target:/github/workspace:ro"
            -w /github/workspace
            -e GIT_CONFIG_COUNT=1
            -e GIT_CONFIG_KEY_0=safe.directory
            -e GIT_CONFIG_VALUE_0=/github/workspace
            -e LLM_API_KEY
            -e LLM_BASE_URL
            -e LLM_MODEL
            -e LLM_PROVIDER
            -e LLM_FALLBACK_1_PROVIDER
            -e LLM_FALLBACK_1_MODEL
            -e LLM_FALLBACK_1_API_KEY
            -e LLM_FALLBACK_1_BASE_URL
            -e LLM_FALLBACK_2_PROVIDER
            -e LLM_FALLBACK_2_MODEL
            -e LLM_FALLBACK_2_API_KEY
            -e LLM_FALLBACK_2_BASE_URL
            -v "${out_dir}:/aurumcode-out"
          )
          if [ -n "${POLICY_REPOSITORY}" ]; then
            docker_args+=(-v "${GITHUB_WORKSPACE}/.aurumcode-policy:/github/policy:ro")
            args+=(--politica /github/policy)
          fi
          scan_rc=0
          docker "${docker_args[@]}" aurumcode-review "${args[@]}" || scan_rc=$?
          docker run --rm --entrypoint chown -v "${out_dir}:/aurumcode-out" aurumcode-review \
            -R "$(id -u):$(id -g)" /aurumcode-out
          exit "${scan_rc}"

      # Only after a conclusive scan (success(), never always()): the
      # artifact is what the caller uploads to code scanning.
      - name: Upload dependency SARIF
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurumcode-dependencies-sarif
          path: ${{ runner.temp }}/aurumcode-out/aurumcode-dependencies.sarif
          if-no-files-found: error
