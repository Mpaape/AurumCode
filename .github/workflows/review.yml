name: AurumCode reusable code review

on:
  workflow_call:
    inputs:
      model:
        description: Optional model id. Empty lets the configured endpoint choose.
        required: false
        type: string
        default: ''
      publication:
        description: comments or review; the repository config is used when omitted.
        required: false
        type: string
        default: ''
      inline_comments:
        description: Add eligible findings as inline comments on changed lines.
        required: false
        type: boolean
        default: false
      security:
        description: Include the deterministic security pass.
        required: false
        type: boolean
        default: true
    secrets:
      LLM_API_KEY:
        description: API key for the configured OpenAI-compatible service.
        required: true
      LLM_BASE_URL:
        description: Base URL for the configured OpenAI-compatible service.
        required: true

jobs:
  review:
    name: Review pull request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      checks: read
    concurrency:
      group: aurumcode-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Check provider configuration
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${LLM_API_KEY}" ] || [ -z "${LLM_BASE_URL}" ]; then
            echo "::error::AurumCode needs LLM_API_KEY and LLM_BASE_URL repository secrets; the review was not run"
            exit 1
          fi

      - name: Resolve tool ref
        id: resolve-tool-ref
        run: |
          set -euo pipefail
          # AUR-493-EXTRACT-BEGIN
          # The consumer pins `uses: Mpaape/AurumCode/.github/workflows/review.yml@<ref>`.
          # github.workflow_ref carries that same pin as
          # "<owner>/<repo>/<path-to-this-file>@<ref>"; everything after the
          # last "@" is the ref that must be built, so the image matches
          # whatever tag or branch the caller actually pinned. When this
          # workflow is invoked by its local path (no "@<ref>", e.g. this
          # repository's own ./.github/workflows/review.yml self-review),
          # github.workflow_ref comes back empty and the ref to build is
          # this run's own commit, github.sha.
          workflow_ref="${{ github.workflow_ref }}"
          if [ -z "$workflow_ref" ]; then
            tool_ref="${{ github.sha }}"
          else
            tool_ref="${workflow_ref##*@}"
          fi
          # AUR-493-EXTRACT-END
          printf 'ref=%s\n' "$tool_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout AurumCode
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Mpaape/AurumCode
          ref: ${{ steps.resolve-tool-ref.outputs.ref }}
          path: .aurumcode-tool
          fetch-depth: 1

      - name: Build AurumCode image
        run: docker build --tag aurumcode-review .aurumcode-tool

      - name: Collect available CI context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_CONTEXT_FILE: ${{ runner.temp }}/aurumcode-ci.json
        run: |
          set +e
          gh pr checks "${PR_NUMBER}" --repo "${REPOSITORY}" --json name,state,workflow,link > "${CI_CONTEXT_FILE}"
          set -e
          # gh exits 1 for failed checks and 8 for pending checks; their JSON
          # remains useful review evidence. Only discard malformed output.
          if ! jq -e 'type == "array"' "${CI_CONTEXT_FILE}" >/dev/null 2>&1; then
            printf '%s\n' '[]' > "${CI_CONTEXT_FILE}"
          fi

      - name: Run and publish code review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          AURUMCODE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AURUMCODE_PR_PERMISSION_MODE: endpoint
          AURUMCODE_CI_CONTEXT_FILE: /tmp/aurumcode-ci.json
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ inputs.model }}
          PUBLICATION: ${{ inputs.publication }}
          INLINE_COMMENTS: ${{ inputs.inline_comments }}
          SECURITY: ${{ inputs.security }}
        run: |
          set -euo pipefail
          args=(review --pr "${PR_NUMBER}" --repo "${REPOSITORY}" --publicar --check)
          if [ -n "${PUBLICATION}" ]; then
            args+=(--modo-publicacao "${PUBLICATION}")
          fi
          if [ "${INLINE_COMMENTS}" = true ]; then
            args+=(--na-linha)
          fi
          if [ "${SECURITY}" = true ]; then
            args+=(--seguranca)
          fi
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/github/workspace" \
            -e GITHUB_TOKEN \
            -e GITHUB_SHA \
            -e AURUMCODE_BASE_SHA \
            -e AURUMCODE_PR_PERMISSION_MODE \
            -e LLM_API_KEY \
            -e LLM_BASE_URL \
            -e LLM_MODEL \
            -e AURUMCODE_CI_CONTEXT_FILE \
            -v "${RUNNER_TEMP}/aurumcode-ci.json:/tmp/aurumcode-ci.json:ro" \
            aurumcode-review "${args[@]}"
