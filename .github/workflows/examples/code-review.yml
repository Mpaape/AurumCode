# Example: AurumCode documentation gate on pull requests
# Copy this file to your repository as .github/workflows/aurumcode-review.yml
#
# AurumCode is a documentation generator. It does not review source code, does
# not post pull request comments and does not score a diff, so this example
# passes only inputs that action.yml actually declares. An input the action does
# not declare is not an error on GitHub: the runner logs "Unexpected input(s)"
# and carries on, which produces a green check for work that never ran.

name: AurumCode - Documentation Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

# pull_request, never pull_request_target: this job checks out and executes the
# fork's head, so it must not hold a writable token or the repository secrets.
# Without this block the workflow inherits the repository default, which can be
# read/write on every scope.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        # Pinned to an immutable commit; the tag beside it is only a reading aid.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Generate documentation
        # The id is what makes steps.aurumcode.outputs.* resolve below. Without
        # it every such expression expands to the empty string and the gate ends
        # up comparing nothing against nothing.
        id: aurumcode
        # Pin the action to the commit you reviewed, never to a mutable branch:
        # @main lets a later upstream push change what executes in your repo.
        uses: Mpaape/AurumCode@6f584b5987c12399bc7a85571dad4a81e28005c8 # reviewed head of PR #1
        with:
          source-dir: '.'
          output-dir: '.aurumcode'
          publish: 'none'

      - name: Fail when the generator produced nothing
        # Step outputs are read through env, never interpolated into the script
        # body: a ${{ }} inside a run: block is substituted before bash parses
        # the line, so a value carrying a quote or a semicolon would execute.
        env:
          DOCS_GENERATED: ${{ steps.aurumcode.outputs.docs-generated }}
          LANGUAGES: ${{ steps.aurumcode.outputs.languages-detected }}
          DOCS_PATH: ${{ steps.aurumcode.outputs.docs-path }}
        run: |
          set -euo pipefail

          # A missing output means the action reported no result. That is a
          # broken run, not an empty repository, so it fails here.
          case "${DOCS_GENERATED}" in
            ''|*[!0-9]*)
              echo "::error::docs-generated='${DOCS_GENERATED}' is not a number - the action reported no result"
              exit 1
              ;;
          esac

          if [ "${DOCS_GENERATED}" -eq 0 ]; then
            echo "::error::the generator wrote 0 markdown files under '${DOCS_PATH}' - failing instead of reporting a green documentation check"
            exit 1
          fi

          echo "${DOCS_GENERATED} markdown files under ${DOCS_PATH} (languages: ${LANGUAGES:-none})"
