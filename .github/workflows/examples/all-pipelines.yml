# Example: AurumCode end-to-end, generate on every pull request and deploy from
# the default branch
# Copy this file to your repository as .github/workflows/aurumcode-complete.yml
#
# Two jobs on purpose. The generate job executes the pull request head, so it is
# read-only and holds no deploy permission. Only the deploy job, which runs on
# the default branch and never on a fork's code, gets pages: write and
# id-token: write. That split is the reason the action offers publish: artifact
# next to publish: pages.

name: AurumCode - Complete Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

# Repository-wide minimum for this workflow; the deploy job widens it for itself
# only. Without this block the workflow inherits the repository default, which
# can be read/write on every scope.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are worth cancelling; a push that may reach the
  # Pages deploy is not, because a cancelled deploy leaves the site half
  # replaced.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate:
    name: Generate documentation
    runs-on: ubuntu-latest

    # pull_request, never pull_request_target: this job checks out and executes
    # the fork's head, so it stays read-only and receives no deploy scope.
    permissions:
      contents: read

    outputs:
      docs-generated: ${{ steps.aurumcode.outputs.docs-generated }}
      languages-detected: ${{ steps.aurumcode.outputs.languages-detected }}
      docs-path: ${{ steps.aurumcode.outputs.docs-path }}

    steps:
      - name: Checkout code
        # Pinned to an immutable commit; the tag beside it is only a reading aid.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Generate documentation
        # The id is what makes steps.aurumcode.outputs.* resolve, both in the
        # job outputs above and in the gate below.
        id: aurumcode
        # v1 is the published release tag and the supported contract. Never a
        # mutable branch: @main lets a later upstream push change what executes
        # in your repo. To pin immutably, use the commit SHA v1 resolves to.
        uses: Mpaape/AurumCode@v1
        with:
          source-dir: '.'
          output-dir: '.aurumcode'
          # Unknown entries stop the run instead of skipping a language quietly.
          extra-toolchains: ''
          # artifact = build the site and upload it as a Pages artifact without
          # deploying, so this read-only job never holds pages: write.
          publish: 'artifact'
          # AI welcome page: both are required together, the action warns when
          # only one is set. Uncomment to enable.
          # llm-api-key: ${{ secrets.LLM_API_KEY }}
          # llm-base-url: ${{ secrets.LLM_BASE_URL }}
          # llm-model: 'claude-3-5-haiku-20241022'

      - name: Fail when the generator produced nothing
        # Outputs travel through env, never through ${{ }} inside the script.
        env:
          DOCS_GENERATED: ${{ steps.aurumcode.outputs.docs-generated }}
          LANGUAGES: ${{ steps.aurumcode.outputs.languages-detected }}
          DOCS_PATH: ${{ steps.aurumcode.outputs.docs-path }}
        run: |
          set -euo pipefail

          # An absent output means the action reported no result. Reporting that
          # as a passing pipeline is the failure mode this gate exists to stop.
          case "${DOCS_GENERATED}" in
            ''|*[!0-9]*)
              echo "::error::docs-generated='${DOCS_GENERATED}' is not a number - the action reported no result"
              exit 1
              ;;
          esac

          if [ "${DOCS_GENERATED}" -eq 0 ]; then
            echo "::error::the generator wrote 0 markdown files under '${DOCS_PATH}' - refusing to hand an empty artifact to the deploy job"
            exit 1
          fi

          {
            echo "### AurumCode documentation"
            echo ""
            echo "- files: ${DOCS_GENERATED}"
            echo "- languages: ${LANGUAGES:-none}"
            echo "- source: ${DOCS_PATH}"
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy:
    name: Deploy to GitHub Pages
    needs: generate
    # Only the default branch deploys. A pull request, including one from a
    # fork, stops at the artifact produced by the read-only job above.
    # Both branches the push trigger above lists, otherwise a master-default
    # repository copies this file and silently never deploys.
    if: >-
      github.event_name == 'push' &&
      contains(fromJSON('["refs/heads/main", "refs/heads/master"]'), github.ref)
    runs-on: ubuntu-latest

    # The only job in this workflow that can write anything, and it writes only
    # to Pages. Requires Settings > Pages > Source = "GitHub Actions".
    permissions:
      pages: write
      id-token: write

    concurrency:
      # A Pages deployment must not be cancelled halfway: the site would be left
      # serving a partially replaced tree.
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy the Pages artifact
        id: deployment
        # Pinned to an immutable commit; the tag beside it is only a reading
        # aid. This is the official Pages deploy action, not a third-party one:
        # it consumes the artifact the generate job uploaded and needs no write
        # access to the repository contents.
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
