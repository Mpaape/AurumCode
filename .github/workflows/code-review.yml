name: AurumCode self review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  statuses: write
  checks: read

concurrency:
  group: aurumcode-self-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    uses: ./.github/workflows/review.yml
    with:
      model: ${{ vars.LLM_MODEL }}
      security: true
    secrets: inherit
