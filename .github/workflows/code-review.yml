# AurumCode reviews its own pull requests.
#
# The tool comes from the published v1 tag, not from the pull request under
# review: a pull request must never get its own code compiled by a job that
# holds a writable token. That also makes this an honest dogfood — the version
# reviewing this repository is the version anyone else gets.
#
# This runs the deterministic security pass, which matches the pull request's
# added lines against the embedded rule catalog and calls no model, so no
# secret is required. Adding LLM_API_KEY and LLM_BASE_URL as repository
# secrets additionally enables the model-backed quality review.

name: AurumCode - Self Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# pull_request, never pull_request_target: the writable token stays scoped to
# same-repository pull requests. On a fork's pull request GitHub downgrades the
# token to read-only and the publish step fails loudly rather than leaving a
# green check on a review nobody could read.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout pull request code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so the base commit resolves from git's object database
          # without a fetch.
          fetch-depth: 0

      - name: Checkout the released AurumCode
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Mpaape/AurumCode
          ref: v1
          # A separate directory, so the released tool tree never mixes with
          # the pull request tree it is about to review.
          path: .aurumcode-release

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.21'

      - name: Build the released AurumCode
        run: go build -C .aurumcode-release -o "${RUNNER_TEMP}/aurumcode" ./cmd/aurumcode

      - name: Review the pull request diff
        id: review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail

          # -fail-on error is the merge gate: exit 3 means at least one
          # error-severity finding. Any other non-zero exit means the review
          # itself broke, and a broken review must never read as a clean one.
          set +e
          "${RUNNER_TEMP}/aurumcode" review -base "${BASE_SHA}" -seguranca -fail-on error \
            >"${RUNNER_TEMP}/review.txt" 2>"${RUNNER_TEMP}/review.err"
          rc=$?
          set -e

          cat "${RUNNER_TEMP}/review.err"
          cat "${RUNNER_TEMP}/review.txt"

          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::AurumCode exited ${rc}: the review did not complete, so this check cannot pass"
            exit 1
          fi

          echo "rc=${rc}" >>"${GITHUB_OUTPUT}"

      - name: Publish the review as a pull request comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RC: ${{ steps.review.outputs.rc }}
        run: |
          set -euo pipefail

          body="${RUNNER_TEMP}/comment.md"
          {
            printf '### AurumCode self review\n\n'
            if [ "${RC}" = "3" ]; then
              printf ':x: **Blocking findings** — at least one finding is severity `error`.\n\n'
            else
              printf ':white_check_mark: **No blocking findings** in the changed lines.\n\n'
            fi
            printf 'Reviewed commit `%s` with AurumCode v1.\n\n' "${HEAD_SHA}"
            # State the scope before the findings. A green check that reads as
            # "this code is fine" when only the deterministic pass ran is the
            # exact failure this product must not commit.
            printf 'Scope: the deterministic security pass over the lines this pull request **adds**. '
            printf 'Pre-existing code is not re-reviewed, and the model-backed quality review is not configured here.\n\n'
            printf '```\n'
            cat "${RUNNER_TEMP}/review.err" "${RUNNER_TEMP}/review.txt"
            printf '```\n'
          } >"${body}"

          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body-file "${body}"

      - name: Fail the check when a blocking finding is present
        if: steps.review.outputs.rc == '3'
        run: |
          echo "::error::AurumCode found at least one error-severity issue in this pull request"
          exit 1
