name: AurumCode self review

# O AurumCode revisa o proprio AurumCode so nas PRs para main (o lote
# dev -> main): cards entram em dev apenas com CI, para que cada chamada ao
# LLM revise um lote inteiro em vez de cada push de card. O job
# `review` chama o workflow reutilizavel local; num evento pull_request ele
# roda a partir do merge ref da PR, entao job.workflow_sha (o commit de onde
# review.yml constroi a imagem e o binario) e o commit de merge da PR: o
# Aurum que revisa e o Aurum que esta sendo mudado. Configuracao, prompt e
# skills de convencao (.aurumcode/) vem da branch base, como em qualquer
# repositorio consumidor.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  statuses: write
  checks: read

concurrency:
  group: aurumcode-self-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    uses: ./.github/workflows/review.yml
    with:
      model: ${{ vars.LLM_MODEL }}
      provider: ${{ vars.LLM_PROVIDER }}
      security: true
    # So o que o review usa (menor privilegio), nunca secrets: inherit.
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}

  # SARIF na aba Security (Code scanning) deste repositorio: o reutilizavel
  # so anexa o arquivo como artefato, porque enviar ao Code scanning exige
  # security-events: write, que so o chamador concede. PR de fork nao
  # recebe a permissao: o if pula e o SARIF fica so como artefato.
  upload-sarif:
    name: SARIF na aba Security
    needs: review
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aurumcode-sarif-${{ github.event.pull_request.number }}
          path: .
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: aurumcode-review.sarif
          category: aurumcode-policy-gate

  # Falha fechada sem provedor: sem LLM_API_KEY/LLM_BASE_URL (PR de fork ou
  # do dependabot, ou secret apagado) o review nao roda e o job `review`
  # falha; este job, em paralelo e sem `needs` (um check pulado conta como
  # aprovado), publica o motivo no status aurumcode/policy-gate como failure.
  # Nunca publica success: com os secrets presentes quem decide o status e o
  # proprio review.
  provider:
    name: LLM provider configured
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed without LLM secrets
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # provider-guard-begin
          set -euo pipefail
          if [ -n "${LLM_API_KEY:-}" ] && [ -n "${LLM_BASE_URL:-}" ]; then
            echo "LLM provider configured; the review job publishes aurumcode/policy-gate"
            exit 0
          fi
          reason="self review nao executado: secrets LLM_API_KEY e LLM_BASE_URL ausentes"
          gh api --method POST "repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=failure -f context=aurumcode/policy-gate \
            -f description="${reason}" >/dev/null ||
            echo "::warning::could not publish the aurumcode/policy-gate failure status"
          echo "::error::${reason}"
          exit 1
          # provider-guard-end
