name: AurumCode feedback loop

# Ciclo de realimentacao (AUR-532), reutilizavel. O repositorio da politica
# central chama este workflow num agendamento:
#
#   on:
#     schedule:
#       - cron: '23 4 * * 1'
#     workflow_dispatch:
#   permissions:
#     contents: write        # grava a branch aurum/realimentacao
#     pull-requests: write   # abre ou atualiza a PR unica
#   jobs:
#     realimentacao:
#       uses: Mpaape/AurumCode/.github/workflows/realimentacao.yml@<sha>
#       with:
#         org: minha-org
#         measurement_workflow: aurumcode-medicao.yml
#       secrets:
#         SIGNALS_TOKEN: ${{ secrets.AURUM_SIGNALS_TOKEN }}
#         POLICY_TOKEN: ${{ secrets.AURUM_POLICY_TOKEN }}   # opcional
#         LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
#         LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
#
# Uma PR aberta com o github.token nao dispara workflows de pull_request, e a
# org precisa permitir "Allow GitHub Actions to create and approve pull
# requests" para o token do job abrir PR. Com POLICY_TOKEN (GitHub App ou
# token fine-grained com contents e pull-requests de escrita no repositorio da
# politica), a PR e aberta por essa identidade e a medicao roda em
# pull_request. Sem ele, este job dispara a medicao por workflow_dispatch
# (o unico evento que o github.token dispara) no arquivo measurement_workflow
# do repositorio da politica, passando o numero da PR.
#
# Le os sinais da org (alertas dispensados, auditorias, /aurum perdeu) com
# SIGNALS_TOKEN (leitura de security-events, actions e issues da org) e grava
# so no repositorio da politica com o token do proprio job. Nada e aplicado
# a politica: a PR e revisada e mergeada por gente. Sem sinal novo, nada e
# aberto nem alterado.
on:
  workflow_call:
    inputs:
      org:
        description: Organizacao cujos repositorios sao lidos.
        required: false
        type: string
        default: ''
      repos:
        description: Repositorios owner/nome separados por virgula (alem de org).
        required: false
        type: string
        default: ''
      measurement_workflow:
        description: Arquivo do workflow de medicao no repositorio da politica (com workflow_dispatch e entrada pr_number), disparado quando nao ha POLICY_TOKEN. Vazio nao dispara.
        required: false
        type: string
        default: ''
    secrets:
      SIGNALS_TOKEN:
        required: true
      POLICY_TOKEN:
        description: Opcional. Token que grava e abre a PR; sem ele, o github.token do job.
        required: false
      LLM_API_KEY:
        required: true
      LLM_BASE_URL:
        required: true

permissions:
  contents: read

concurrency:
  group: aurumcode-realimentacao-${{ github.repository }}
  cancel-in-progress: false

jobs:
  realimentacao:
    name: Realimentacao da politica
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout AurumCode
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Collect signals and propose
        env:
          ORG: ${{ inputs.org }}
          REPOS: ${{ inputs.repos }}
          POLICY_REPO: ${{ github.repository }}
          SIGNALS_TOKEN: ${{ secrets.SIGNALS_TOKEN }}
          POLICY_TOKEN: ${{ secrets.POLICY_TOKEN || github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: >-
          docker run --rm
          -e ORG -e REPOS -e POLICY_REPO -e SIGNALS_TOKEN -e POLICY_TOKEN
          -e LLM_API_KEY -e LLM_BASE_URL
          -v "${GITHUB_WORKSPACE}:/src"
          -w /src
          golang:1.27.1-alpine3.24@sha256:8a5910f31396cd4d89662f56c68b3ae31d374308270a1c3bd96672ee5ed43414
          sh scripts/ci/realimentacao.sh

      - name: Dispatch the measurement
        if: ${{ inputs.measurement_workflow != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_POLICY_TOKEN: ${{ secrets.POLICY_TOKEN != '' }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ inputs.measurement_workflow }}
        run: |
          set -euo pipefail
          if [ "${HAS_POLICY_TOKEN}" = "true" ]; then
            echo "PR aberta com POLICY_TOKEN: a medicao roda pelo evento pull_request"
            exit 0
          fi
          pr="$(gh pr list --repo "${REPOSITORY}" --head aurum/realimentacao --state open --json number --jq '.[0].number // empty')"
          if [ -z "${pr}" ]; then
            echo "nenhuma PR de realimentacao aberta: nada a medir"
            exit 0
          fi
          gh workflow run "${WORKFLOW}" --repo "${REPOSITORY}" -f pr_number="${pr}"
