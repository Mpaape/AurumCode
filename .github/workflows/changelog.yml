name: Changelog

# Check obrigatorio de changelog (AUR-509). Sem filtro de paths e sem `if:`
# no job: um job pulado conta como verde num required check. O nome do job
# ("Changelog obrigatório") e o contexto estavel a exigir na protecao da main.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog obrigatório
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the changelog entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          docker run --rm
          -e BASE_SHA
          -v "${GITHUB_WORKSPACE}:/src"
          -w /src
          golang:1.27.1-alpine3.24@sha256:8a5910f31396cd4d89662f56c68b3ae31d374308270a1c3bd96672ee5ed43414
          sh scripts/ci/changelog-check.sh
