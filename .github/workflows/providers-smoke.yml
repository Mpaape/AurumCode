name: Providers smoke
# Smoke ao vivo dos perfis de provedor de LLM (docs/provedores.md). So manual:
# chamada real custa e nunca roda em PR. O job `detectar` ve quais provedores
# tem secrets; so esses ganham um job `smoke` (uma revisao minima com
# `aurumcode review`). Os demais aparecem no resumo como "nao verificado" e
# nao ganham job nenhum: nunca um verde sem chamada real.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: providers-smoke
  cancel-in-progress: false
jobs:
  detectar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configurados: ${{ steps.detectar.outputs.configurados }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: detectar
        name: Detect providers with secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_RESOURCE: ${{ secrets.AZURE_OPENAI_RESOURCE }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
        run: bash scripts/ci/providers-smoke-detect.sh

  smoke:
    needs: detectar
    if: needs.detectar.outputs.configurados != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        provedor: ${{ fromJSON(needs.detectar.outputs.configurados) }}
    name: smoke (${{ matrix.provedor }})
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve AurumCode version
        id: tool_version
        env:
          TOOL_SHA: ${{ github.sha }}
          TOOL_DIR: .
        run: bash "$TOOL_DIR/scripts/ci/resolve-tool-version.sh"
      - name: Build the product image
        env:
          AURUMCODE_VERSION: ${{ steps.tool_version.outputs.version }}
        run: docker build --build-arg AURUMCODE_VERSION="$AURUMCODE_VERSION" --tag aurumcode-smoke .
      - name: Review a small diff with the live provider
        env:
          PROVEDOR: ${{ matrix.provedor }}
          SMOKE_VARS: ${{ toJSON(vars) }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_RESOURCE: ${{ secrets.AZURE_OPENAI_RESOURCE }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
        run: bash scripts/ci/providers-smoke.sh
      - name: Remove the image
        if: always()
        run: docker rmi aurumcode-smoke >/dev/null 2>&1 || true
