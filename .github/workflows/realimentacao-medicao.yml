name: AurumCode feedback measurement

# Medicao do corpus do AUR-523 antes e depois de uma PR de realimentacao
# (AUR-532), reutilizavel. O repositorio da politica chama este workflow nas
# PRs da branch aurum/realimentacao:
#
#   on:
#     pull_request:
#       branches: [main]
#     workflow_dispatch:          # disparado pelo realimentacao.yml sem POLICY_TOKEN
#       inputs:
#         pr_number:
#           required: true
#           type: number
#   permissions:
#     contents: read
#     pull-requests: write
#   jobs:
#     medicao:
#       uses: Mpaape/AurumCode/.github/workflows/realimentacao-medicao.yml@<sha>
#       with:
#         pr_number: ${{ inputs.pr_number || 0 }}
#
# A medicao usa o provedor falso do AUR-523, derivado dos rotulos dos casos:
# ela mede o efeito da politica nas regras citaveis e no gate, nao a
# qualidade de um modelo real.
#
# O job comenta a tabela antes/depois na PR e falha quando "aprovado com
# defeito" sobe, o recall cai ou um lado nao pode ser medido. A seguranca
# decide o merge; o check so mostra o efeito.
on:
  workflow_call:
    inputs:
      pr_number:
        description: Numero da PR (disparo por workflow_dispatch); 0 usa o evento pull_request.
        required: false
        type: number
        default: 0

permissions:
  contents: read

jobs:
  medicao:
    name: Medicao do corpus
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          INPUT_PR: ${{ inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${EVENT_PR}" ]; then
            printf 'number=%s\nbase=%s\nhead=%s\n' "${EVENT_PR}" "${EVENT_BASE}" "${EVENT_HEAD}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${INPUT_PR:-0}" = "0" ]; then
            echo "::error::sem pull_request e sem pr_number: nada a medir"
            exit 1
          fi
          gh api "repos/${REPOSITORY}/pulls/${INPUT_PR}" \
            --jq '"number=\(.number)\nbase=\(.base.sha)\nhead=\(.head.sha)"' >> "${GITHUB_OUTPUT}"

      - name: Checkout AurumCode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .aurumcode-tool
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout policy at the base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.base }}
          path: .politica-base
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout policy at the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head }}
          path: .politica-pr
          persist-credentials: false
          fetch-depth: 1

      - name: Measure the corpus before and after
        id: medir
        run: >-
          docker run --rm
          -v "${GITHUB_WORKSPACE}:/w"
          -w /w/.aurumcode-tool
          golang:1.27.1-alpine3.24@sha256:8a5910f31396cd4d89662f56c68b3ae31d374308270a1c3bd96672ee5ed43414
          sh scripts/ci/realimentacao-medir.sh /w/.politica-base /w/.politica-pr /w/medicao.md

      - name: Comment the measurement
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          if [ ! -s medicao.md ]; then
            printf '## Medição do corpus (AUR-523)\n\n**Não medido.** A medição falhou antes de produzir a tabela.\n' > medicao.md
          fi
          gh pr comment "${PR_NUMBER}" --repo "${REPOSITORY}" --body-file medicao.md
