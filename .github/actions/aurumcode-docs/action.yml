name: 'AurumCode Documentation Generator'
description: 'Generate searchable documentation for ANY codebase (Go, Python, JS, Java, etc.)'
author: 'AurumCode'

branding:
  icon: 'book-open'
  color: 'blue'

inputs:
  github_token:
    description: 'GitHub token for API access'
    required: true
  language:
    description: 'Primary language (auto|go|python|javascript|typescript|java|ruby|rust|php|markdown)'
    required: false
    default: 'auto'
  deploy:
    description: 'Deploy to GitHub Pages'
    required: false
    default: 'true'
  search:
    description: 'Enable Pagefind search'
    required: false
    default: 'true'
  theme:
    description: "Jekyll theme. Only 'just-the-docs' is implemented; any other value is rejected with an error rather than silently ignored."
    required: false
    default: 'just-the-docs'
  overwrite_existing:
    description: >-
      Allow this action to overwrite scaffolding files that already exist in the
      caller repository (_config.yml, Gemfile, index.md, _docs/*.md).
      Default is 'false': existing caller files are never destroyed.
    required: false
    default: 'false'

outputs:
  site_url:
    description: 'URL of deployed documentation'
    value: ${{ steps.url.outputs.url }}
  pages_generated:
    description: 'Number of pages generated'
    value: ${{ steps.build.outputs.count }}

runs:
  using: 'composite'
  steps:
    # SECURITY: every caller-controlled value is passed through `env:` and read
    # as a quoted shell variable. GitHub expressions are substituted as TEXT
    # into the script body before the shell parses it, so `${{ ... }}` must
    # never appear inside a `run:` body.
    - name: Detect language
      id: detect
      shell: bash
      env:
        INPUT_LANGUAGE: ${{ inputs.language }}
      run: |
        set -euo pipefail
        DOC_LANG="${INPUT_LANGUAGE}"

        case "${DOC_LANG}" in
          auto|go|python|javascript|typescript|java|ruby|rust|php|markdown) ;;
          *)
            echo "::error::Unsupported 'language' input. Received an unrecognised value; allowed values are: auto, go, python, javascript, typescript, java, ruby, rust, php, markdown." >&2
            exit 1
            ;;
        esac

        if [ "${DOC_LANG}" = "auto" ]; then
          # Auto-detect primary language
          if [ -f "go.mod" ]; then
            DOC_LANG="go"
          elif [ -f "package.json" ]; then
            DOC_LANG="javascript"
          elif [ -f "requirements.txt" ] || [ -f "setup.py" ] || [ -f "pyproject.toml" ]; then
            DOC_LANG="python"
          elif [ -f "pom.xml" ] || [ -f "build.gradle" ]; then
            DOC_LANG="java"
          elif [ -f "Gemfile" ]; then
            DOC_LANG="ruby"
          elif [ -f "Cargo.toml" ]; then
            DOC_LANG="rust"
          elif [ -f "composer.json" ]; then
            DOC_LANG="php"
          else
            DOC_LANG="markdown"
          fi
        fi

        echo "language=${DOC_LANG}" >> "${GITHUB_OUTPUT}"
        echo "Detected language: ${DOC_LANG}"

    - name: Generate code documentation
      id: generate
      shell: bash
      env:
        DETECTED_LANGUAGE: ${{ steps.detect.outputs.language }}
      run: |
        set -euo pipefail
        DOC_LANG="${DETECTED_LANGUAGE}"
        echo "Generating ${DOC_LANG} documentation..."

        mkdir -p _api

        case "${DOC_LANG}" in
          go)
            # Fail closed: a missing toolchain must be an explicit error, not an
            # empty documentation set reported as success.
            if ! command -v go >/dev/null 2>&1; then
              echo "::error::language=go was selected but the 'go' toolchain is not available on this runner. Add actions/setup-go before this action." >&2
              exit 1
            fi
            echo "Generating Go documentation..."
            pkgs="$(go list ./... 2>/dev/null | grep -v "/vendor/" || true)"
            if [ -z "${pkgs}" ]; then
              echo "::error::language=go was selected but 'go list ./...' returned no packages. Nothing was documented." >&2
              exit 1
            fi
            for pkg in ${pkgs}; do
              pkg_name="$(printf '%s' "${pkg}" | sed 's|.*/||' | sed 's|/|.|g')"
              {
                echo "---"
                echo "layout: default"
                echo "title: ${pkg_name}"
                echo "parent: API Reference"
                echo "---"
                echo ""
                echo "# ${pkg}"
                echo ""
                echo '```go'
              } > "_api/${pkg_name}.md"
              go doc -all "${pkg}" 2>/dev/null >> "_api/${pkg_name}.md" || echo "No documentation" >> "_api/${pkg_name}.md"
              echo '```' >> "_api/${pkg_name}.md"
            done
            ;;

          python)
            if ! command -v python3 >/dev/null 2>&1; then
              echo "::error::language=python was selected but 'python3' is not available on this runner. Add actions/setup-python before this action." >&2
              exit 1
            fi
            echo "Generating Python documentation..."
            py_files="$(find . -name "*.py" -not -path "*/.*" -not -path "*/test*" 2>/dev/null | head -20 || true)"
            if [ -n "${py_files}" ]; then
              while IFS= read -r py; do
                [ -n "${py}" ] || continue
                module="$(printf '%s' "${py}" | sed 's|^\./||' | sed 's|\.py$||' | sed 's|/|.|g')"
                {
                  echo "---"
                  echo "layout: default"
                  echo "title: ${module}"
                  echo "parent: API Reference"
                  echo "---"
                  echo ""
                  echo "# ${module}"
                } > "_api/${module}.md"
              done <<< "${py_files}"
            fi
            ;;

          javascript|typescript)
            if [ ! -f "package.json" ]; then
              echo "::error::language=${DOC_LANG} was selected but no package.json was found at the repository root. Nothing was documented." >&2
              exit 1
            fi
            echo "Generating JavaScript/TypeScript documentation..."
            js_files="$(find . \( -name "*.js" -o -name "*.ts" \) -not -path "*/node_modules/*" -not -path "*/.*" 2>/dev/null | head -20 || true)"
            if [ -n "${js_files}" ]; then
              while IFS= read -r js; do
                [ -n "${js}" ] || continue
                base="$(basename "${js}" | sed 's|\.[^.]*$||')"
                {
                  echo "---"
                  echo "layout: default"
                  echo "title: ${base}"
                  echo "parent: API Reference"
                  echo "---"
                  echo ""
                  echo "# ${base}"
                } > "_api/${base}.md"
              done <<< "${js_files}"
            fi
            ;;

          java)
            echo "Generating Java documentation..."
            java_files="$(find . -name "*.java" -not -path "*/.*" -not -path "*/test*" 2>/dev/null | head -20 || true)"
            if [ -n "${java_files}" ]; then
              while IFS= read -r java_file; do
                [ -n "${java_file}" ] || continue
                base="$(basename "${java_file}" .java)"
                {
                  echo "---"
                  echo "layout: default"
                  echo "title: ${base}"
                  echo "parent: API Reference"
                  echo "---"
                  echo ""
                  echo "# ${base}"
                } > "_api/${base}.md"
              done <<< "${java_files}"
            fi
            ;;

          *)
            echo "Markdown-only mode (language: ${DOC_LANG})"
            echo "Collecting existing documentation..."
            ;;
        esac

        # Create API index
        GENERATED_ON="$(date +%Y-%m-%d)"
        {
          echo "---"
          echo "layout: default"
          echo "title: API Reference"
          echo "nav_order: 3"
          echo "has_children: true"
          echo "---"
          echo ""
          echo "# API Reference"
          echo ""
          echo "Auto-generated documentation from source code."
          echo ""
          echo "_Updated: ${GENERATED_ON}_"
        } > "_api/index.md"

        echo "Generated API documentation"

    - name: Setup Jekyll
      shell: bash
      env:
        OVERWRITE_EXISTING: ${{ inputs.overwrite_existing }}
        INPUT_THEME: ${{ inputs.theme }}
      run: |
        set -euo pipefail

        # Fail closed: only 'just-the-docs' is actually wired into _config.yml.
        # Silently ignoring another value would publish a site the caller did
        # not ask for and report success.
        case "${INPUT_THEME}" in
          just-the-docs) ;;
          *)
            echo "::error::Unsupported 'theme' input. This action only implements 'just-the-docs'; the requested value is not wired into _config.yml and would have been silently ignored." >&2
            exit 1
            ;;
        esac

        # Never destroy a caller-owned file unless the caller opted in.
        write_guarded() {
          target="$1"
          if [ -e "${target}" ] && [ "${OVERWRITE_EXISTING}" != "true" ]; then
            echo "::notice::'${target}' already exists in this repository and was left untouched (set overwrite_existing: 'true' to replace it)."
            return 1
          fi
          return 0
        }

        if write_guarded "_config.yml"; then
          PROJECT_NAME="$(basename "$(pwd)")"
          cat > "_config.yml" <<EOF
        title: "${PROJECT_NAME} Documentation"
        description: "Auto-generated documentation"
        remote_theme: just-the-docs/just-the-docs@v0.8.0
        plugins:
          - jekyll-remote-theme
          - jekyll-seo-tag
        search_enabled: true
        color_scheme: dark
        EOF
        fi

        if write_guarded "Gemfile"; then
          cat > "Gemfile" <<'EOF'
        source 'https://rubygems.org'
        gem 'jekyll', '~> 4.3'
        gem 'just-the-docs', '0.8.0'
        gem 'jekyll-remote-theme'
        gem 'jekyll-seo-tag'
        gem 'webrick'
        EOF
        fi

    - name: Convert docs to Jekyll
      shell: bash
      env:
        OVERWRITE_EXISTING: ${{ inputs.overwrite_existing }}
      run: |
        set -euo pipefail
        mkdir -p _docs

        write_guarded() {
          target="$1"
          if [ -e "${target}" ] && [ "${OVERWRITE_EXISTING}" != "true" ]; then
            echo "::notice::'${target}' already exists in this repository and was left untouched (set overwrite_existing: 'true' to replace it)."
            return 1
          fi
          return 0
        }

        # Convert markdown files
        for md in docs/*.md README.md; do
          if [ -f "${md}" ]; then
            base="$(basename "${md}" .md)"
            title="$(printf '%s' "${base}" | tr '_-' '  ' | sed 's/\b\(.\)/\u\1/g')"

            if write_guarded "_docs/${base}.md"; then
              {
                echo "---"
                echo "layout: default"
                echo "title: ${title}"
                echo "parent: Documentation"
                echo "---"
                echo ""
                cat "${md}"
              } > "_docs/${base}.md"
            fi
          fi
        done

        # Create index if none exists
        if write_guarded "index.md"; then
          cat > "index.md" <<'IDXEOF'
        ---
        layout: home
        title: Home
        nav_order: 1
        ---

        # Documentation

        Auto-generated documentation for this project.

        [View API Reference](/api/){: .btn .btn-primary }
        [View Documentation](/docs/){: .btn }
        IDXEOF
        fi

    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v gem >/dev/null 2>&1; then
          echo "::error::Ruby 'gem' is not available on this runner; the Jekyll site cannot be built. Add ruby/setup-ruby before this action." >&2
          exit 1
        fi
        gem install bundler
        bundle install

    - name: Build Jekyll site
      id: build
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v bundle >/dev/null 2>&1; then
          echo "::error::'bundle' is not available on this runner; the Jekyll site cannot be built." >&2
          exit 1
        fi
        bundle exec jekyll build
        COUNT="$(find _site -name "*.html" | wc -l | tr -d ' ')"
        echo "count=${COUNT}" >> "${GITHUB_OUTPUT}"
        # Fail closed: zero pages is a failed build, not a successful no-op.
        if [ "${COUNT}" -eq 0 ]; then
          echo "::error::Jekyll build produced 0 HTML pages. Refusing to report success for an empty site." >&2
          exit 1
        fi
        echo "Built ${COUNT} pages"

    - name: Add search index
      if: inputs.search == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v npx >/dev/null 2>&1; then
          echo "::error::search was requested but 'npx' is not available on this runner; the Pagefind index cannot be built. Add actions/setup-node before this action or set search: 'false'." >&2
          exit 1
        fi
        npx -y pagefind --site _site
        echo "Search index created"

    - name: Deploy to GitHub Pages
      id: deploy
      if: inputs.deploy == 'true'
      # Pinned to an immutable commit SHA (mutable tags can be repointed).
      uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3.9.3
      with:
        github_token: ${{ inputs.github_token }}
        publish_dir: ./_site
        publish_branch: gh-pages
        force_orphan: false
        user_name: 'AurumCode Bot'
        user_email: 'bot@aurumcode.dev'

    - name: Output URL
      id: url
      # Only report a site URL when something was actually published.
      if: inputs.deploy == 'true'
      shell: bash
      env:
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        OWNER="${REPOSITORY%%/*}"
        NAME="${REPOSITORY##*/}"
        SITE_URL="https://${OWNER}.github.io/${NAME}/"
        echo "url=${SITE_URL}" >> "${GITHUB_OUTPUT}"
        echo "Documentation: ${SITE_URL}"
