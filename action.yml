name: AurumCode code review
description: Review pull requests with the configured model, context and prompt; fail if the model review is inconclusive.
author: Mpaape

branding:
  icon: check-circle
  color: purple

inputs:
  publication:
    description: "Publication mode: config, comments or review. config reads .aurumcode/config.yml."
    required: false
    default: config
  inline-comments:
    description: Publish findings anchored to added lines when possible.
    required: false
    default: 'false'
  security:
    description: Include the deterministic security pass alongside the model review.
    required: false
    default: 'true'
  check:
    description: Publish a commit status that blocks merges on error-severity findings.
    required: false
    default: 'false'
  fail-on:
    description: 'Optional severity gate: error, warning or info. Use none for no gate.'
    required: false
    default: none
  model:
    description: Optional model id. Empty/default lets the configured endpoint choose.
    required: false
    default: default
  changelog:
    description: Compute and expose the suggested next version and changelog entry from the reviewed commits.
    required: false
    default: 'false'
  policy_path:
    description: Optional absolute path to the directory containing a central policy's .aurumcode/config.yml. It must be outside the reviewed checkout (/github/workspace), which is always refused; copy the policy into $RUNNER_TEMP/_github_home/<dir> in an earlier step and pass /github/home/<dir>. Its rules, ignore patterns and, when set, review language/publication take precedence over this repository's own. Empty keeps today's behavior.
    required: false
    default: ''

outputs:
  version:
    description: Suggested next semantic version derived from the reviewed commit messages, when the changelog feature is enabled.
  changelog_bump:
    description: Suggested bump name (major, minor, patch or none).
  changelog:
    description: Rendered changelog entry for the suggested version.

runs:
  using: docker
  image: Dockerfile
  # AUR-549: this standalone, Docker-container action does NOT run
  # `aurumcode sbom` -- GitHub automatically bind-mounts the host's docker
  # socket into a `using: docker` action's own container, but a `docker
  # run` issued from INSIDE that container through the mounted socket
  # creates a SIBLING container on the host daemon, which needs HOST-side
  # paths for its own -v mounts; this container has no generic way to
  # learn the host path behind its own /github/workspace, so the
  # reproducible --trivy-bin wrapper documented in
  # docs/configuration.md's "SBOM CycloneDX com Trivy" section only runs
  # from a reusable-workflow JOB STEP (.github/workflows/review.yml),
  # which calls `docker run` directly from the runner, never from inside
  # a container. Until a future card solves that path-translation
  # problem for the standalone action, SBOM generation is only wired for
  # callers of review.yml.
  # AUR-551: for the exact same reason, this standalone Docker-container
  # action does NOT run `aurumcode sign` either -- cosign itself would
  # need the same `docker run` escape SBOM generation does, and keyless
  # signing additionally needs an OIDC id-token this container-only
  # action has no step of its own to request. See docs/configuration.md's
  # "Assinatura com Sigstore/Cosign" section. Until a future card solves
  # the path-translation problem above, signing is only wired for callers
  # of review.yml.
  # AUR-518: the policy path reaches the CLI through the env var it already
  # falls back to (AURUMCODE_POLICY) when --politica is absent, so no change
  # to scripts/action-entrypoint.sh's fixed positional argument count is
  # needed. An empty policy_path leaves AURUMCODE_POLICY empty, which is the
  # documented "no policy" case -- today's behavior, unchanged.
  # The CLI refuses any policy that resolves inside its working directory,
  # and the entrypoint runs it from /github/workspace (the reviewed
  # checkout), so the only usable policy location is the other directory
  # the job author fills before this container starts: /github/home, the
  # mount of $RUNNER_TEMP/_github_home.
  env:
    AURUMCODE_POLICY: ${{ inputs.policy_path }}
  args:
    - action
    - ${{ inputs.publication }}
    - ${{ inputs.inline-comments }}
    - ${{ inputs.security }}
    - ${{ inputs.check }}
    - ${{ inputs.fail-on }}
    - ${{ inputs.model }}
    - ${{ inputs.changelog }}
